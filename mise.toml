# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. Rust is pinned in
# rust-toolchain.toml, which the baseline's `rust` entry is checked against. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]
# CI installs only the tools a job needs; `mise run` must not install the rest behind its back. ~keep
task.run_auto_install = false

[tools]
"github:Goldziher/poly" = "0.36.1"
python = "3.15.2"
uv = "0.13.9"
node = "26.13.1"
pnpm = "12.21.0"
"github:taiki-e/cargo-hack" = "0.6.46"
"github:nextest-rs/nextest" = { version = "0.9.152", version_prefix = "cargo-nextest-" }
"github:EmbarkStudios/cargo-about" = "0.9.3"
ripgrep = "15.2.0"
sccache = "0.20.0"

[tasks.setup]
description = "Install all dependencies and initialize project. Idempotent."
run = ["mise install", { task = "setup:sccache" }, "cargo fetch", { task = "governance:hooks:install" }, "echo 'Setup complete'"]

[tasks."setup:sccache"]
description = "Cache Rust compilation across worktrees with sccache: install it when missing, point cargo at it. Idempotent."
run = """
set -eu
command -v sccache >/dev/null 2>&1 || mise install sccache
bin="$(command -v sccache || mise which sccache)"
cfg="${CARGO_HOME:-$HOME/.cargo}/config.toml"
mkdir -p "$(dirname "$cfg")"
if ! grep -q 'rustc-wrapper' "$cfg" 2>/dev/null; then
  # sccache cannot cache incremental builds, so cargo's incremental mode is turned off with it.
  printf '\n[build]\nrustc-wrapper = "%s"\nincremental = false\n' "$bin" >> "$cfg"
  echo "cargo now builds through $bin ($cfg)"
else
  echo "$cfg already sets a rustc-wrapper; left as it is"
fi
"$bin" --start-server >/dev/null 2>&1 || true
"$bin" --show-stats | head -4
"""

[tasks.build]
description = "Build the basemind binary"
run = "cargo build --release"

[tasks.test]
description = "Run all tests"
run = ["cargo test --workspace --no-fail-fast", { task = "hermes:test" }]

[tasks."test:verbose"]
description = "Run tests with verbose output"
run = "cargo test --workspace --no-fail-fast -- --nocapture"

[tasks."check:features"]
description = "Clippy every feature alone (lib and bins) and the documented combinations (all targets)"
run = [
  "cargo hack clippy --each-feature --no-dev-deps --keep-going -- -D warnings",
  'cargo clippy --all-targets --features "comms memory" -- -D warnings',
  'cargo clippy --all-targets --features "comms documents memory" -- -D warnings',
  'cargo clippy --all-targets --features "documents documents-ocr documents-ner" -- -D warnings',
]

[tasks."check:msrv"]
description = "Check every published crate, basemind with `full`, on the Rust release its rust-version names"
run = "cargo hack check --rust-version --workspace --locked --features full --ignore-unknown-features"

[tasks.check]
description = "Run all checks (lint + test)"
run = [{ task = "lint" }, { task = "test" }]

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.update]
description = "Update dependencies (compatible versions only — no Cargo.toml edits)"
run = "cargo update"

[tasks.upgrade]
description = "Upgrade dependencies to latest, including incompatible bumps (rewrites Cargo.toml)"
run = ["cargo upgrade --incompatible", "cargo update"]

[tasks."plugin:generate"]
description = "Generate native plugins and all public compatibility exports"
run = ["python3 scripts/sync_plugin_version.py", "bash scripts/sync-plugin-skills.sh"]

[tasks."plugin:pytest"]
description = "Python tests of the plugin hooks, launchers, exports and the pip and Hermes packages"
env = { PYTHONPATH = "pip-package" }
run = "uv run --no-project --with pytest --with certifi --with build --with mcp==1.28.1 python -m pytest scripts/tests tests/test_legacy_plugin_exports.py tests/test_session_start_hook.py tests/test_agent_hooks.py tests/test_mcp_launch_prune.py tests/test_mcp_launch_signals.py tests/test_mcp_launch_download.py tests/test_fetch_release_binaries.py tests/test_pre_tool_guard_hook.py tests/test_hook_json_lib.py pip-package/tests pip-package-hermes/tests"

[tasks."eval:pytest"]
description = "Python tests of the retrieval-eval generators, gate and corpus fetch (benchmarks/eval)"
run = "uv run --no-project --with pytest python -m pytest benchmarks/eval -q"

[tasks."plugin:test"]
description = "Exercise archive, public export, and actual CLI integration contracts"
run = [
  { task = "plugin:pytest" },
  "node tests/basemind_pi_cli_contract.mjs",
  "node --test tests/npm_binary_override.test.cjs tests/npm_install_https.test.cjs tests/npm_install_staging.test.cjs tests/npm_install_proxy.test.cjs tests/opencode_binary_check.test.mjs tests/opencode_plugin_setup.test.mjs",
]

[tasks."plugin:verify"]
description = "Verify native plugin and public export freshness"
tools = { node = "26.13.1" }
run = [
  "python3 scripts/sync_plugin_version.py --check",
  "npx -y ai-rulez@latest verify --plugin",
  "python3 scripts/sync_public_skills.py --check",
  "python3 scripts/sync_legacy_plugin_exports.py --check",
]

[tasks.harden]
description = "Run the real-OSS hardening harness against all canary repos"
run = "./scripts/harden.sh"

[tasks."demo:record"]
description = "Record the README demos (docs/media/*.gif, docs/demos/comms-demo.gif) with vhs"
run = "./scripts/demo-record.sh"

[tasks."release:sync-version"]
description = "Sync version across every shipped surface (Cargo, npm wrappers, PyPI, plugin manifests)"
usage = 'arg "<version>" help="Release version, e.g. 0.1.0"'
run = [
  './scripts/release-bump.sh "$usage_version"',
  "cargo test --test config_schema --features full -- --ignored regenerate_schema",
]

[tasks."release:licenses"]
description = "Generate THIRD_PARTY_LICENSES, the notice file every release archive ships (cargo-about over the `full` graph)"
run = "cargo about generate --locked --fail --features full --output-file THIRD_PARTY_LICENSES about.hbs"

[tasks."release:dry-run"]
description = "Dry-run the real release packaging path for the host platform (licences + build + package-release.sh + checksums + launcher smoke)"
run = [{ task = "release:licenses" }, "./scripts/release-dry-run.sh"]

[task_config]
includes = ["mise-tasks", "mise-tasks/shared.toml"]
