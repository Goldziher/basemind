# This crate inherits `[workspace.lints]` from the root workspace via `[lints] workspace = true`. ~keep
# It is the desktop-UI front-end (ADR-0006). The interactive Tauri window — which carries a per- ~keep
# platform webview toolchain — lands behind a `desktop` feature in a later slice, so the default ~keep
# build (and `cargo build --workspace` / CI) stays webview-free. ~keep
[package]
name = "basemind-ui"
version = "0.27.0"
edition = "2024"
license = "MIT"
description = "Desktop UI front-end for basemind — renders the code graph over the code map (ADR-0006)."
publish = false

# `tauri` / `tauri-build` / `url` are referenced ONLY through the `desktop` feature, so an
# unused-dependency sweep sees no import and removes them — which silently breaks `desktop`'s
# `dep:` references and makes the whole workspace manifest unparseable (every cargo command in the
# repo fails to load). Pin them as ignored so the lint cannot strip them again. ~keep
[package.metadata.cargo-machete]
ignored = ["tauri", "tauri-build", "url"]

[[bin]]
name = "basemind-ui"
path = "src/main.rs"

[features]
# Default builds (and `cargo build --workspace` / CI) resolve NEITHER tauri nor tauri-build: both are
# optional deps activated only by `desktop`, so the webview toolchain stays out of the default tree. ~keep
# `desktop` also turns on basemind's `comms` so the resident window can ensure the daemon + resolve the ~keep
# live `/ui` URL it loads (the same served page the `ui` tool and a browser drive). ~keep
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:url", "basemind/comms"]

[dependencies]
anyhow = "1"
basemind = { path = "../..", default-features = false }
tauri = { version = "2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
