[package]
include = ["/Cargo.toml", "/Cargo.lock", "/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
name = "basemind-lsp-positions"
version = "0.3.5"
description = "LSP-compatible character positions (maintained basemind fork, tree-sitter 0.27 port)"
homepage = "https://github.com/Goldziher/basemind"
repository = "https://github.com/Goldziher/basemind"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
edition = "2024"

[lib]
name = "lsp_positions"
test = false

[features]
bincode = ["dep:bincode"]
tree-sitter = ["dep:tree-sitter"]

[dependencies]
# ~keep bincode 3 is a placeholder; the compatible 2.x requirement stays on the usable API.
bincode = { version = "2.0.1", optional = true }
memchr = "2.8"
serde = { version = "1", features = ["derive"], optional = true }
tree-sitter = { version = "0.27", optional = true }
unicode-segmentation = { version = "1.13" }

[lints]
workspace = true
