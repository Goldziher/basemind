name: Install system dependencies
description: Install system dependencies for building basemind with --features full

runs:
  using: composite
  steps:
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Installing Linux dependencies"

        sudo apt-get update || true

        sudo apt-get install -y \
          tesseract-ocr tesseract-ocr-eng \
          libssl-dev pkg-config build-essential cmake \
          libmagic-dev protobuf-compiler patchelf

        echo "::endgroup::"

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Installing macOS dependencies"

        # Add homebrew paths
        if [[ -d "/opt/homebrew/bin" ]]; then
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"
        fi
        if [[ -d "/usr/local/bin" ]]; then
          export PATH="/usr/local/bin:/usr/local/sbin:${PATH}"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/usr/local/sbin" >> "$GITHUB_PATH"
        fi

        # A failed install fails the job: a leg without tesseract would run the OCR tests against
        # whatever the image happens to carry.
        brew install cmake tesseract tesseract-lang libmagic pkg-config protobuf
        tesseract --version | head -n 1
        protoc --version

        echo "::endgroup::"

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'

        Write-Host "::group::Installing Windows dependencies"

        # Install protoc via choco
        Write-Host "Installing protobuf..."
        choco install -y protoc --no-progress
        if ($LASTEXITCODE -ne 0) { throw "choco install protoc failed ($LASTEXITCODE)" }
        # choco exits 0 having installed nothing when its feed fails ("Chocolatey installed 0/0
        # packages"), so check that protoc exists and pin it for prost-build by path.
        $protoc = Get-Command protoc -ErrorAction SilentlyContinue
        if (-not $protoc) { throw "choco install protoc left no protoc on PATH" }
        & $protoc.Source --version
        Add-Content -Path $env:GITHUB_ENV -Value "PROTOC=$($protoc.Source)"

        # Install tesseract
        Write-Host "Installing Tesseract..."
        choco install -y tesseract --no-progress
        if ($LASTEXITCODE -ne 0) { throw "choco install tesseract failed ($LASTEXITCODE)" }

        # Download tessdata
        $tesseractPath = "C:\Program Files\Tesseract-OCR"
        if (-not (Test-Path $tesseractPath)) { throw "Tesseract is not at $tesseractPath after install" }
        if (Test-Path $tesseractPath) {
          $tessdataPath = "$tesseractPath\tessdata"
          if (-not (Test-Path $tessdataPath)) {
            New-Item -ItemType Directory -Path $tessdataPath -Force | Out-Null
          }

          # Download English
          if (-not (Test-Path "$tessdataPath\eng.traineddata")) {
            Write-Host "Downloading English language data..."
            $engUrl = "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata"
            Invoke-WebRequest -Uri $engUrl -OutFile "$tessdataPath\eng.traineddata"
          }

          # Download OSD
          if (-not (Test-Path "$tessdataPath\osd.traineddata")) {
            Write-Host "Downloading OSD data..."
            $osdUrl = "https://github.com/tesseract-ocr/tessdata_fast/raw/main/osd.traineddata"
            Invoke-WebRequest -Uri $osdUrl -OutFile "$tessdataPath\osd.traineddata"
          }

          $env:TESSDATA_PREFIX = $tessdataPath
          Add-Content -Path $env:GITHUB_ENV -Value "TESSDATA_PREFIX=$tessdataPath"
        }

        Write-Host "::endgroup::"

    - name: Install libheif
      uses: ./.github/actions/install-libheif
