name: Set up Rust
description: Install the Rust release pinned in rust-toolchain.toml, with optional extra targets

inputs:
  targets:
    description: Comma-separated extra targets to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read the pinned channel
      id: channel
      shell: bash
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "::error::rust-toolchain.toml names no channel"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ steps.channel.outputs.channel }}
        components: rustfmt, clippy
        targets: ${{ inputs.targets }}
