name: Set up Rust
description: Install the Rust release pinned in rust-toolchain.toml, with optional extra targets

inputs:
  targets:
    description: Comma-separated extra targets to install
    required: false
    default: ""
  use-sccache:
    description: Route rustc through sccache, backed by the GitHub Actions cache (the same setup as xberg-io/actions/setup-rust)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Read the pinned channel
      id: channel
      shell: bash
      run: |
        set -euo pipefail
        channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "::error::rust-toolchain.toml names no channel"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ steps.channel.outputs.channel }}
        components: rustfmt, clippy
        targets: ${{ inputs.targets }}
    - name: Set up sccache
      if: inputs.use-sccache == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      continue-on-error: true
    - name: Route rustc through sccache
      if: inputs.use-sccache == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v sccache >/dev/null 2>&1 && [ -z "${SCCACHE_PATH:-}" ]; then
          echo "::warning::sccache is unavailable; compiling without it"
          exit 0
        fi
        {
          echo "SCCACHE_GHA_ENABLED=true"
          echo "RUSTC_WRAPPER=${SCCACHE_PATH:-sccache}"
          echo "SCCACHE_STARTUP_TIMEOUT=120"
          echo "SCCACHE_IDLE_TIMEOUT=0"
          echo "CARGO_INCREMENTAL=0"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "SCCACHE_NO_DAEMON=1"
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache"
          fi
        } >> "$GITHUB_ENV"
