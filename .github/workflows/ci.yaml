name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # ~keep The `full` feature build (ONNX + lancedb + vendored stack-graphs) produces huge debug objects
  # ~keep that exhaust the standard runners' disk — surfacing as an `ld` bus error (truncated object) on
  # ~keep Linux and an explicit ENOSPC on macOS. Level 1 keeps panic file:line (so backtraces stay useful)
  # ~keep while dropping the variable/type DWARF that dominates the size.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  # ~keep The Linux `full` leg is the tightest of the five and still hit ENOSPC at level 1 even after
  # ~keep the purge below, so `matrix.debug` overrides it to 0 there. Panic locations
  # ~keep (`file.rs:line:col`) come from `core::panic::Location` and survive; what is lost is line
  # ~keep numbers inside RUST_BACKTRACE frames.

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true

  toolchain:
    name: toolchain baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/check-toolchain@v1

  test:
    name: test / ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      CARGO_PROFILE_DEV_DEBUG: ${{ matrix.debug }}
      CARGO_PROFILE_TEST_DEBUG: ${{ matrix.debug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
            timeout_minutes: 180
            debug: "1"
          - os: ubuntu-latest
            features: "full"
            # ~keep 60 was sized when this leg died early on ENOSPC; now that it runs the whole
            # ~keep suite it needs the same budget as the other `full` leg — it passed `cargo test`
            # ~keep and was cut off mid `cargo build --release` at exactly 60m. 90 then proved too
            # ~keep tight on a COLD cache: a dependency refresh changes `Cargo.lock`, misses the
            # ~keep rust-cache key, and rebuilds debug + release from scratch, which roughly doubles
            # ~keep both `full` legs (Linux 38m -> 79m, macOS 55m -> past 90m). The ceiling has to
            # ~keep cover the cold run, because a leg that times out never saves a cache and so stays
            # ~keep cold on every retry.
            timeout_minutes: 180
            debug: "0"
          # ~keep `documents` without `documents-ocr` / `documents-ner`: the only leg that compiles and
          # ~keep runs the tests gated on a missing tier.
          - os: ubuntu-latest
            features: "comms documents"
            timeout_minutes: 180
            debug: "0"
          - os: macos-26
            features: ""
            timeout_minutes: 180
            debug: "1"
          - os: macos-26
            features: "full"
            # ~keep Keep the cold-cache test budget independent of the full release build.
            timeout_minutes: 180
            # ~keep Debug info off, as on the Linux `full` leg: building the test binaries grew
            # ~keep `target` from 15 to 65 GB and left 27 of 97 GiB free (run 43863171731), the
            # ~keep pressure behind the earlier Fjall EIO on store open.
            debug: "0"
          - os: windows-latest
            features: "comms"
            timeout_minutes: 180
            debug: "1"
    steps:
      - uses: actions/checkout@v7

      # ~keep The `full` build is disk-heavy; reclaim space up front on the legs that build it so the
      # ~keep debug + release target dirs and the downloaded ONNX models don't hit ENOSPC.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux' && (matrix.features == 'full' || matrix.features == 'comms documents')
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          # ~keep The list above still left the leg short by a few GB (chronic ENOSPC mid-`cargo test`).
          # ~keep None of the toolchains below are used by this job: it needs rustup, the apt system
          # ~keep deps installed in the next step, and nothing else.
          sudo rm -rf /usr/local/.ghcup /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/miniconda /opt/az || true
          sudo apt-get clean || true
          sudo docker image prune --all --force || true
          df -h /
      - name: Free disk space (macOS)
        if: runner.os == 'macOS' && matrix.features == 'full'
        run: |
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          df -h /

      # ~keep The windows-2025 image leaves C: with ~500 MB free, below the scan's pre-flight space
      # ~keep check, so every test that scans into a tempdir failed with InsufficientSpace. The
      # ~keep checkout and target/ already live on D:; move TMP/TEMP there too.
      - name: Move temp to the work drive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install system dependencies
        if: matrix.features == 'full' || matrix.features == 'comms documents'
        uses: ./.github/actions/install-system-deps

      - name: Install protoc (Linux, default-features)
        if: runner.os == 'Linux' && matrix.features == ''
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS, default-features)
        if: runner.os == 'macOS' && matrix.features == ''
        run: brew install protobuf

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.features }}

      # ~keep tests/upgrade_from_release.rs is compiled only with `documents`, which is these two legs
      # ~keep on Linux and macOS. It upgrades an index built by an older release, so it needs that
      # ~keep release's binary; under CI an absent binary fails the test rather than skipping it. 0.28.0
      # ~keep is the newest release that still code-maps prose (the migration path), `latest` the
      # ~keep same-shape upgrade.
      - name: Fetch release binaries for the upgrade test
        if: (runner.os == 'Linux' || runner.os == 'macOS') && (matrix.features == 'full' || matrix.features == 'comms documents')
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) triple=x86_64-unknown-linux-gnu ;;
            macOS) triple=aarch64-apple-darwin ;;
          esac
          list="$(scripts/fetch-release-binaries.sh "$RUNNER_TEMP/release-binaries" "$triple" 0.28.0 latest)"
          echo "BASEMIND_UPGRADE_FROM_BIN=$list" >> "$GITHUB_ENV"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --tests --features "${{ matrix.features }}" -- -D warnings

      # ~keep Disk use around the tests: a run of the macOS `full` leg failed its last store-opening
      # ~keep test binaries with EIO from Fjall, and only these numbers can say whether the disk
      # ~keep (build output plus every test binary's temp data home) was full by then.
      - name: Disk usage before the tests
        shell: bash
        run: |
          df -h . "$RUNNER_TEMP" "${TMPDIR:-/tmp}" || true
          du -sh target "${TMPDIR:-/tmp}" 2>/dev/null || true

      # ~keep `--no-fail-fast`: plain `cargo test` stops at the first failing test BINARY, so a leg
      # ~keep reports one target's failures and hides every straggler behind it. A cross-cutting
      # ~keep change leaves failures in several binaries at once, and discovering them one CI
      # ~keep round-trip at a time costs an afternoon per release.
      - name: cargo test (macOS full)
        if: runner.os == 'macOS' && matrix.features == 'full'
        shell: bash
        run: |
          cargo test --workspace --features full --quiet --no-fail-fast 2>&1 |
            python3 -u scripts/utf8-test-log.py

      - name: cargo test
        if: runner.os != 'macOS' || matrix.features != 'full'
        run: cargo test --workspace --features "${{ matrix.features }}" --quiet --no-fail-fast

      - name: Disk usage after the tests
        if: always()
        shell: bash
        run: |
          df -h . "$RUNNER_TEMP" "${TMPDIR:-/tmp}" || true
          du -sh target "${TMPDIR:-/tmp}" 2>/dev/null || true

      - name: cargo build --release
        if: runner.os != 'macOS' || matrix.features != 'full'
        run: cargo build --release --quiet --bin basemind --features "${{ matrix.features }}"

  macos-full-release:
    name: build / macos-26 / full
    runs-on: macos-26
    timeout-minutes: 180
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-26-full-release

      - name: cargo build --release
        run: cargo build --locked --release --quiet --bin basemind --features full --target aarch64-apple-darwin

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ~keep The plugin launcher and the session-start hook are shell scripts no cargo test reaches.
  # ~keep macOS runs them too: the launcher reads the process list and file ages with the BSD `ps`
  # ~keep and `find` there, which the Linux run never touches.
  plugin-scripts:
    name: plugin scripts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv
      # ~keep The session-start tests skip themselves without `jq`, so its absence must fail the step.
      - name: pytest (plugin launcher and session-start hook)
        run: |
          set -euo pipefail
          command -v jq
          uv run --no-project --with pytest python -m pytest -v tests/test_mcp_launch_prune.py tests/test_session_start_hook.py

  hermes:
    name: hermes plugin package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv
      # ~keep The tests import the GENERATED package under plugin/.hermes/package (conftest.py puts it first
      # ~keep on sys.path), so this also fails when the checked-in generated output is missing.
      - name: pytest
        run: uv run --no-project --with pytest --with mcp==1.28.1 python -m pytest pip-package-hermes/tests
      - name: Build and validate the wheel metadata
        run: |
          set -euo pipefail
          wheel_dir="$(mktemp -d)"
          trap 'rm -rf "$wheel_dir"' EXIT
          uv build --wheel --out-dir "$wheel_dir" plugin/.hermes/package
          wheels=("$wheel_dir"/*.whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
          uvx --from twine==7.0.0 --with packaging==26.3 twine check --strict "${wheels[0]}"

  memory-ceiling:
    name: scan under a 1 GiB cgroup (Linux)
    # ~keep On the ubuntu-26.04 image a MemoryMax scope never kills `tail /dev/zero`; the harness probe hangs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2

      # Issue #62 was reported from a daemon under a systemd `MemoryMax`, and the whole class was
      # invisible to the matrix above because no leg there ever runs under a memory cgroup. A scope
      # with a real ceiling turns an unbounded scan into an OOM kill (137) instead of a slow green
      # leg, so this is the one job that reproduces the reporter's environment rather than
      # approximating it.
      #
      # A SYSTEM scope via sudo, not `systemd-run --user`: a GitHub runner has no user session bus,
      # so the `--user` form fails to start and would report a green leg that never enforced
      # anything -- the precise failure mode this job exists to rule out.  ~keep
      - name: Build the scanner
        run: cargo build --bin basemind

      - name: Generate a synthetic corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/corpus/src
          cd /tmp/corpus
          git init -q .
          for f in $(seq 0 2999); do
            {
              echo "use std::collections::HashMap;"
              for i in $(seq 0 60); do
                printf 'pub fn module_%s_item_%s(a: u64, b: &str) -> HashMap<String, usize> { let _ = b; HashMap::new() }\n' "$f" "$i"
              done
            } > "src/module_$f.rs"
          done
          # The scan runs as root inside the scope, so the repo must be trusted for that user too.
          sudo git config --system --add safe.directory /tmp/corpus

      - name: Confirm the scope really enforces a ceiling
        run: |
          set -euo pipefail
          # Prove the harness before trusting its verdict: a scope that silently fails to apply
          # MemoryMax would make the scan step pass for the wrong reason.
          if sudo systemd-run --scope -p MemoryMax=64M -p MemorySwapMax=0 \
               bash -c 'tail /dev/zero'; then
            echo "MemoryMax was NOT enforced: a process that should have been killed survived."
            echo "This job cannot vouch for the scan step, so fail rather than report a false pass."
            exit 1
          fi
          echo "confirmed: the scope enforces MemoryMax"

      - name: Scan under MemoryMax=1G
        run: |
          set -euo pipefail
          sudo systemd-run --scope -p MemoryMax=1G -p MemorySwapMax=0 \
            env BASEMIND_DATA_HOME=/tmp/bm-data \
            ./target/debug/basemind scan --root /tmp/corpus
          echo "scan completed inside a 1 GiB ceiling"

  hardening:
    name: hardening harness (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: Swatinem/rust-cache@v2

      - name: run harden.sh
        run: ./scripts/harden.sh

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harden-results
          path: /tmp/basemind-harden/results.ndjson
