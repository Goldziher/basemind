name: Publish Packages

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      plugins-only:
        description: "Publish only missing plugin registry versions; dispatch it from the release tag (Use workflow from: vX.Y.Z)"
        type: boolean
        default: false
      tag:
        description: "Release tag to publish (e.g., v0.1.0)"
        required: false
        type: string

concurrency:
  # Key on the resolved release tag, not github.ref: a tag push (refs/tags/vX) and a ~keep
  # workflow_dispatch rerun for the SAME tag carry different refs and would otherwise race, ~keep
  # while two unrelated manual dispatches share refs/heads/main and would cancel each other. ~keep
  # Never cancel a publish mid-flight — cargo publish and release promotion are irreversible. ~keep
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Read-only by default; each job that writes (the release record, a registry) asks for exactly that.
permissions:
  contents: read

jobs:
  ci_gate:
    name: Require a green CI
    runs-on: ubuntu-latest
    timeout-minutes: 250
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag push runs on the tagged commit; a dispatch runs this workflow from a branch and names
      # the tag to publish, whose commit is the one CI must have passed. A plugins-only dispatch
      # publishes the dispatched commit itself.
      - name: Resolve the commit being published
        id: commit
        env:
          TAG: ${{ github.event.inputs.tag }}
          PLUGINS_ONLY: ${{ inputs.plugins-only }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$PLUGINS_ONLY" != "true" ]; then
            [ -n "$TAG" ] || { echo "::error::a release dispatch must name the tag to publish"; exit 1; }
            git fetch --no-tags --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          else
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publishing commit $sha"

      - name: Require a successful ci run on that commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-green-ci.sh "${{ steps.commit.outputs.sha }}"

  meta:
    if: ${{ !inputs.plugins-only }}
    name: Resolve versions
    needs: ci_gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      python_version: ${{ steps.version.outputs.python_version }}
      tag: ${{ steps.version.outputs.tag }}
      crates_exists: ${{ steps.published.outputs.crates_exists }}
      npm_exists: ${{ steps.published.outputs.npm_exists }}
      opencode_exists: ${{ steps.published.outputs.opencode_exists }}
      pypi_exists: ${{ steps.published.outputs.pypi_exists }}
      pypi_hermes_exists: ${{ steps.published.outputs.pypi_hermes_exists }}
      release_assets_exist: ${{ steps.release_assets.outputs.release_assets_exist }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="${tag#v}"
          python_version="${version//-rc./rc}"

          {
            echo "version=$version"
            echo "python_version=$python_version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $tag"
          echo "Cargo/npm version: $version"
          echo "Python version: $python_version"

      - name: Verify version consistency across all surfaces
        run: python3 scripts/check_release_versions.py "${{ steps.version.outputs.version }}"

      # The marker lets main name tools the pinned release lacks (tests/plugin_tool_skew.rs). A
      # release ends that state: the commit it is cut from must not carry the marker.
      - name: Refuse a release whose plugin content is marked unreleased
        run: |
          set -euo pipefail
          if [ -e .github/unreleased-surface.toml ]; then
            cat .github/unreleased-surface.toml
            echo "::error::.github/unreleased-surface.toml is present: remove it in the release commit once the manifests pin a binary that serves the plugin content."
            exit 1
          fi

      # A Git-pinned dependency cannot be published to crates.io. v0.33.0 skipped crates.io for
      # that reason with a green run, so every registry but crates.io shipped it. A release that
      # cannot reach a registry stops here instead, before anything is published.
      - name: Require a crates.io-publishable manifest
        run: |
          set -euo pipefail
          if grep -En '^[[:space:]]*[A-Za-z0-9_-]+[[:space:]]*=.*git[[:space:]]*=' Cargo.toml; then
            echo "::error::Cargo.toml has a Git-pinned dependency (above); crates.io cannot publish basemind. Publish or vendor it first."
            exit 1
          fi

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Require vendored crates to match their crates.io versions
        run: python3 scripts/check_vendored_crates.py --release

      - name: Detect already-published versions
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"
          python_version="${{ steps.version.outputs.python_version }}"

          crates_exists=false
          if curl -fsS "https://crates.io/api/v1/crates/basemind/${version}" >/dev/null; then
            crates_exists=true
          fi

          npm_exists=false
          if pnpm view "basemind@${version}" version >/dev/null 2>&1; then
            npm_exists=true
          fi

          opencode_exists=false
          if pnpm view "basemind-opencode@${version}" version >/dev/null 2>&1; then
            opencode_exists=true
          fi

          pypi_exists=false
          if curl -fsS "https://pypi.org/pypi/basemind/${python_version}/json" >/dev/null; then
            pypi_exists=true
          fi

          pypi_hermes_exists=false
          if curl -fsS "https://pypi.org/pypi/basemind-hermes-plugin/${python_version}/json" >/dev/null; then
            pypi_hermes_exists=true
          fi

          {
            echo "crates_exists=$crates_exists"
            echo "npm_exists=$npm_exists"
            echo "opencode_exists=$opencode_exists"
            echo "pypi_exists=$pypi_exists"
            echo "pypi_hermes_exists=$pypi_hermes_exists"
          } >> "$GITHUB_OUTPUT"

          echo "Already published?"
          echo "  crates.io:          $crates_exists"
          echo "  npm:                $npm_exists"
          echo "  npm (opencode):     $opencode_exists"
          echo "  PyPI:               $pypi_exists"
          echo "  PyPI (hermes):      $pypi_hermes_exists"

      - name: Detect a COMPLETE existing release (all archives + checksums)
        id: release_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          release_assets_exist=false

          # Only treat the release as "already published" when the FULL asset set a
          # downstream install needs is present. A partial draft (some builders failed or
          # were cancelled) must report false so create_release + the build matrix rerun and
          # heal the gaps. The previous "any asset present" check skipped the builders on a
          # partial draft, so a release that lost a platform binary could never complete on
          # a rerun (the v0.10.0 / release-window failure class).
          required=(
            "basemind-x86_64-unknown-linux-gnu.tar.gz"
            "basemind-aarch64-unknown-linux-gnu.tar.gz"
            "basemind-aarch64-apple-darwin.tar.gz"
            "basemind-x86_64-pc-windows-msvc.zip"
            "basemind_${version}_checksums.txt"
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets -q '.assets[].name' > /tmp/have_assets.txt || true
            missing=0
            for asset in "${required[@]}"; do
              if ! grep -qx "$asset" /tmp/have_assets.txt 2>/dev/null; then
                echo "  missing: $asset"
                missing=$((missing + 1))
              fi
            done
            if [ "$missing" -eq 0 ]; then
              release_assets_exist=true
            fi
          fi

          echo "release_assets_exist=$release_assets_exist" >> "$GITHUB_OUTPUT"
          echo "Complete release already present? $release_assets_exist"

  create_release:
    name: Create GitHub release
    needs: meta
    if: >-
      ${{ !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release_info.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      # The release body is the tagged CHANGELOG's section for this version; a version without
      # one stops the release here, before anything is built or published.
      - name: Extract the release notes from the CHANGELOG
        run: python3 scripts/changelog_section.py "${{ needs.meta.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Ensure the GitHub release exists
        id: ensure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"

          # `gh release view --json databaseId` is the query GitHub eventually settles on; retry it
          # a bounded few times because the record is not always visible the instant create returns.
          release_id_for() {
            local t="$1" id=""
            for _ in 1 2 3 4 5 6 7 8; do
              id="$(gh release view "$t" --json databaseId -q .databaseId 2>/dev/null || true)"
              if [ -n "$id" ] && [ "$id" != "null" ]; then
                printf '%s' "$id"
                return 0
              fi
              sleep 3
            done
            return 1
          }

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            prerelease=""
            case "$tag" in
              *-rc.* | *-beta* | *-alpha*) prerelease="--prerelease" ;;
            esac
            # Create as a DRAFT. The build matrix uploads binaries to it, but it
            # stays invisible (assets not publicly downloadable) until the
            # finalize_release job promotes it — and that job only runs once
            # checksums (which requires all 4 platform binaries) succeeds. A failed
            # platform build therefore leaves a hidden draft, not a live release
            # with missing binaries and no checksums (the v0.10.0 failure mode that
            # broke the plugin launcher's checksum-verified download).
            # `gh release create` has no --json; create, then resolve the numeric id with retries
            # (a fresh record is briefly invisible to the release API).
            gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag --draft $prerelease >/dev/null
            if ! release_id="$(release_id_for "$tag")"; then
              echo "::error::created release for $tag but its id never became visible"
              exit 1
            fi
            echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Created draft release id: $release_id"
          fi

      - name: Capture the release id
        id: release_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Every later job addresses assets by this id, never by the tag: a tag can resolve to
          # more than one release record, and that is what split the v0.27.0 assets.
          if [ "${{ steps.ensure.outputs.created }}" = "true" ]; then
            # Reuse the id create just returned. Re-resolving the id from the releases list is
            # racy: the list endpoint omits the draft for a short window right after creation, so
            # a freshly created release looked absent and the run died with "no release record".
            release_id="${{ steps.ensure.outputs.release_id }}"
            echo "Reusing created release id: $release_id"
          else
            release_id="$(bash .github/scripts/release-asset.sh resolve "${{ needs.meta.outputs.tag }}")"
            echo "Resolved release id: $release_id"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  # Builds, packages and runs every archive on a clean runner (release-build.yaml). Read-only: the
  # upload below is the one job that writes to the release.
  build:
    name: Build and smoke-test archives
    needs: [meta, create_release]
    if: >-
      ${{ !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yaml
    with:
      ref: ${{ needs.meta.outputs.tag }}
      version: ${{ needs.meta.outputs.version }}

  checksums:
    if: ${{ !inputs.plugins-only }}
    name: Upload archives, checksums and provenance
    needs: [meta, create_release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          persist-credentials: false

      - name: Download the smoke-tested archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-archive-*
          merge-multiple: true
          path: dist

      - name: Verify all 4 platform archives are present
        run: |
          set -euo pipefail
          # Checksums must cover every platform. Generating the file from a partial asset set is
          # what let v0.27.0 ship archives no downloader could verify.
          missing=0
          for asset in \
            basemind-x86_64-unknown-linux-gnu.tar.gz \
            basemind-aarch64-unknown-linux-gnu.tar.gz \
            basemind-aarch64-apple-darwin.tar.gz \
            basemind-x86_64-pc-windows-msvc.zip; do
            if [ ! -f "dist/$asset" ]; then
              echo "::error::the build produced no $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing of 4 platform archives missing; refusing to checksum a partial release"
            exit 1
          fi
          ls -l dist

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum basemind-*.tar.gz basemind-*.zip | sort >"basemind_${{ needs.meta.outputs.version }}_checksums.txt"
          cat "basemind_${{ needs.meta.outputs.version }}_checksums.txt"

      # Signed build provenance for each archive, verifiable with `gh attestation verify <file>
      # --repo Goldziher/basemind`. The checksums file comes from the same release as the archive,
      # so it proves integrity only; the attestation ties the archive to this workflow run.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/basemind-*.tar.gz
            dist/basemind-*.zip

      - name: Upload archives and checksums to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Refuse to upload while the tag is ambiguous or the draft has been promoted — the
          # v0.27.0 state, in which uploads followed the tag onto a second release record.
          release_id="$(bash .github/scripts/release-asset.sh resolve \
            "${{ needs.meta.outputs.tag }}" true "${{ needs.create_release.outputs.release_id }}")"
          for archive in dist/basemind-*.tar.gz; do
            bash .github/scripts/release-asset.sh upload "$release_id" "$archive" application/gzip
          done
          bash .github/scripts/release-asset.sh upload "$release_id" \
            dist/basemind-x86_64-pc-windows-msvc.zip application/zip
          bash .github/scripts/release-asset.sh upload "$release_id" \
            "dist/basemind_${{ needs.meta.outputs.version }}_checksums.txt" text/plain

  finalize_release:
    name: Publish GitHub release
    needs: [meta, create_release, checksums]
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.meta.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The promotion step runs `.github/scripts/release-asset.sh`; without a checkout the
      # workspace is empty and `bash` exits 127. Every other job that uses the script checks
      # out first — only this one was missed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Promote draft to a published release once complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"

          # require_draft=false here, unlike every upload site: this job is the one that promotes,
          # and on a re-run over an already-complete release `create_release` is skipped and the
          # record is already published. Refusing that would strand the wrapper publishes.
          # expected_id is empty on that same path, which `resolve` treats as "no expectation".
          release_id="$(bash .github/scripts/release-asset.sh resolve \
            "$tag" false "${{ needs.create_release.outputs.release_id }}")"

          # The full asset set a launcher / npm install.js / pip downloader needs:
          # every platform archive plus the checksums file they verify against. v0.27.0 was
          # promoted with 3 of 5 archives and no checksums file, so every downloader broke.
          required=(
            "basemind-x86_64-unknown-linux-gnu.tar.gz"
            "basemind-aarch64-unknown-linux-gnu.tar.gz"
            "basemind-aarch64-apple-darwin.tar.gz"
            "basemind-x86_64-pc-windows-msvc.zip"
            "basemind_${version}_checksums.txt"
          )

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            -q '.[].name' >/tmp/assets.txt
          missing=0
          for asset in "${required[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::release $release_id (tag $tag) is missing $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::release $release_id (tag $tag) is incomplete ($missing required assets missing); leaving it as a draft"
            exit 1
          fi

          # By id, not tag: the tag would follow whichever record GitHub decides it points at.
          # Idempotent — a PATCH to draft=false on a published release is a no-op.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false >/dev/null
          echo "promoted release $release_id (tag $tag) to published"

  # The marketplaces serve ./plugin from main (ADR-0035), so a host takes the release's plugin, and
  # the binary version its launcher pins, as soon as the release commit is on main. That commit
  # therefore waits on its release branch until the release is public, and only this job moves main
  # onto it (ADR-0046).
  advance_main:
    name: Fast-forward main to the release
    needs: [meta, finalize_release]
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.finalize_release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.meta.outputs.tag }}

      - name: Fast-forward main onto the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "main already contains $TAG ($sha)"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "$sha"; then
            echo "::error::main moved during the release and cannot fast-forward to $TAG; merge $TAG into main by hand"
            exit 1
          fi
          # A plain push: GitHub refuses it unless it is still a fast-forward when it arrives.
          git push origin "$sha:refs/heads/main"
          # A push made with the workflow token starts no workflow, so ci on main is started here.
          gh workflow run ci.yaml --ref main
          echo "main fast-forwarded to $TAG ($sha); ci dispatched on main"

  publish_crates:
    name: Publish crates.io
    needs: [meta, finalize_release]
    # Gate on a finalized GitHub release like the wrapper publishes do: crates.io is ~keep
    # irreversible, so don't publish source unless the platform binaries built and the ~keep
    # release promoted — keeps the surfaces atomic across a partial failure. ~keep
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.meta.outputs.crates_exists != 'true' && needs.finalize_release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # `cargo publish` verifies the packaged crate by building it, with default features unless
      # told otherwise. basemind is verified with `full` below, which needs the system libraries.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates_auth

      - name: Publish to crates.io (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: |
          set -euo pipefail
          # basemind depends on four vendored, in-tree crates (forks we own) and on basemind-agents.
          # crates.io is a closed registry, so each must be published — and in topological order —
          # before the crate that depends on it: the two leaves, then stack-graphs, then
          # tree-sitter-stack-graphs, then basemind-agents, then basemind itself last. `cargo publish` waits for each to appear in the index before
          # returning, so the next publish resolves it.
          # Re-running a tag finds its own earlier uploads, so "already exists" is a skip. That is
          # only safe because meta's vendored-crate check has proven an existing version's source
          # equals the tree's.
          publish() {
            pkg="$1"
            shift
            echo "::group::cargo publish -p $pkg $*"
            if cargo publish -p "$pkg" --allow-dirty "$@" 2>publish.err; then
              cat publish.err; echo "::endgroup::"; return 0
            fi
            # Idempotent across re-runs of the same tag: a version already on crates.io is a skip.
            if grep -Eq "already (exists|uploaded)|is already uploaded" publish.err; then
              echo "$pkg already published; skipping"; cat publish.err; echo "::endgroup::"; return 0
            fi
            cat publish.err >&2; echo "::endgroup::"; return 1
          }
          publish basemind-lsp-positions
          publish basemind-tree-sitter-graph
          publish basemind-stack-graphs
          publish basemind-tree-sitter-stack-graphs
          publish basemind-agents
          # The verification build resolves the forks from crates.io, as a user's build does, and
          # with every feature the release binary has: a fork that drifted from its published
          # version fails here instead of in a user's `cargo install --features full`.
          publish basemind --features full

  publish_npm:
    name: Publish npm
    needs: [meta, finalize_release]
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.meta.outputs.npm_exists != 'true' && needs.finalize_release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          unset NODE_AUTH_TOKEN
          cd npm-package
          version="${{ needs.meta.outputs.version }}"
          if [[ "$version" == *"-rc."* ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi

          pnpm publish --no-git-checks --provenance --access public --tag "$npm_tag"

  publish_opencode:
    name: Publish npm (basemind-opencode, OpenCode and Pi)
    needs: [meta, finalize_release]
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.finalize_release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}

      - name: Stage and verify the combined agent package
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          bash scripts/stage-agent-package.sh "$package_dir"
          pnpm --dir "$package_dir" pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pi-pack.json"
          node - "$RUNNER_TEMP/pi-pack.json" <<'JS'
          const fs = require('node:fs');
          const files = JSON.parse(fs.readFileSync(process.argv[2])).files.map((file) => file.path);
          const skills = files.filter((file) => /^skills\/[^/]+\/SKILL\.md$/.test(file));
          if (skills.length !== 10 || !files.includes('.pi/extensions/basemind.ts') || !files.includes('basemind.js') || !files.includes('tui.js')) {
            throw new Error(`Incomplete agent package: ${skills.length} skills`);
          }
          console.log(`Packed ${skills.length} skills, the Pi extension, and OpenCode adapters`);
          JS

      - name: Verify exact legacy skill, extension and TUI archive bytes
        run: |
          set -euo pipefail
          archive="$(jq -r '.filename' "$RUNNER_TEMP/pi-pack.json")"
          [[ "$archive" == /* ]] || archive="$RUNNER_TEMP/$archive"
          python3 scripts/verify_plugin_distribution.py legacy-npm "$archive"

      - name: Publish to npm
        if: needs.meta.outputs.opencode_exists != 'true'
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          unset NODE_AUTH_TOKEN
          version="${{ needs.meta.outputs.version }}"
          if [[ "$version" == *"-rc."* ]]; then
            npm_tag="beta"
          else
            npm_tag="latest"
          fi

          archive="$(jq -r '.filename' "$RUNNER_TEMP/pi-pack.json")"
          # pnpm 12 reports an absolute path; older versions a bare file name.
          [[ "$archive" == /* ]] || archive="$RUNNER_TEMP/$archive"
          pnpm publish --no-git-checks "$archive" --provenance --access public --tag "$npm_tag"

  publish_pypi:
    name: Publish PyPI
    needs: [meta, finalize_release]
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.meta.outputs.pypi_exists != 'true' && needs.finalize_release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Python
        uses: xberg-io/actions/setup-mise@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          install-args: python
          config-ref: ${{ github.sha }}

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          cd pip-package
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pip-package/dist
          skip-existing: true

  publish_plugin_npm:
    name: Publish npm agent plugin (OpenCode and Pi)
    needs: [meta, finalize_release]
    if: >-
      ${{ !inputs.plugins-only && (needs.finalize_release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Install reviewed ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0

      - name: Verify generated product bundles and public skills
        run: |
          ai-rulez verify --plugin
          python3 scripts/sync_public_skills.py --check
          python3 scripts/sync_plugin_version.py --check

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          install-args: node pnpm
          config-ref: ${{ github.sha }}

      - name: Verify packed Pi and OpenCode resources
        run: |
          set -euo pipefail
          pnpm --dir plugin pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/plugin-pack.json"
          node - "$RUNNER_TEMP/plugin-pack.json" <<'JS'
          const fs = require('node:fs');
          const files = JSON.parse(fs.readFileSync(process.argv[2])).files.map((file) => file.path);
          const skills = files.filter((file) => /^\.pi\/skills\/[^/]+\/SKILL\.md$/.test(file));
          const prompts = files.filter((file) => /^\.pi\/prompts\/[^/]+\.md$/.test(file));
          if (skills.length !== 10 || prompts.length !== 6 || !files.includes('.opencode/plugins/basemind.js')) {
            throw new Error(`Incomplete plugin: ${skills.length} skills, ${prompts.length} prompts`);
          }
          console.log(`Packed ${skills.length} Pi skills, ${prompts.length} prompts, and the OpenCode adapter`);
          JS

      - name: Verify exact packaged Pi and OpenCode resource bytes
        run: |
          archive="$(jq -r '.filename' "$RUNNER_TEMP/plugin-pack.json")"
          [[ "$archive" == /* ]] || archive="$RUNNER_TEMP/$archive"
          python3 scripts/verify_plugin_distribution.py npm "$archive"

      - name: Publish the agent package
        run: |
          set -euo pipefail
          name="$(jq -r '.name' plugin/package.json)"
          version="${{ needs.meta.outputs.version }}"
          if ! pnpm view "$name" version >/dev/null 2>&1; then
            echo "::error::$name needs a first manual publish and trusted publisher setup; see plugin/README.md."
            exit 1
          fi
          if pnpm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published; skipping"
            exit 0
          fi
          case "$version" in
            *-rc.* | *-beta* | *-alpha*) npm_tag=next ;;
            *) npm_tag=latest ;;
          esac
          unset NODE_AUTH_TOKEN
          archive="$(jq -r '.filename' "$RUNNER_TEMP/plugin-pack.json")"
          [[ "$archive" == /* ]] || archive="$RUNNER_TEMP/$archive"
          for attempt in 1 2 3; do
            if pnpm publish --no-git-checks "$archive" --provenance --access public --tag "$npm_tag"; then
              break
            fi
            if pnpm view "$name@$version" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done

  publish_plugin_artifacts:
    name: Publish all agent runtime archives and marketplaces
    needs: [meta, finalize_release]
    if: >-
      ${{ !inputs.plugins-only && (needs.finalize_release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
      - name: Verify public skill exports
        run: python3 scripts/sync_public_skills.py --check
      - name: Package all supported plugin runtimes
        uses: xberg-io/actions/package-ai-rulez-plugin@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          cursor-marketplace: "true"
          tag: ${{ needs.meta.outputs.tag }}
          config-directory: .ai-rulez
          version-sync-script: scripts/sync_plugin_version.py
      - name: Archive verified runtime bundles and marketplace indexes
        shell: bash
        env:
          PLUGIN_TAG: ${{ needs.meta.outputs.tag }}
          PLUGIN_PRODUCT: basemind
        run: |
          set -euo pipefail
          test -n "$PLUGIN_TAG"
          bundle="dist/${PLUGIN_PRODUCT}-plugins-${PLUGIN_TAG//\//-}.tar.gz"
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - -C dist/plugin . | gzip -n > "$bundle"
          (cd dist && sha256sum "$(basename "$bundle")") > "$bundle.sha256"
      - name: Attach verified plugin archive and metadata
        uses: xberg-io/actions/upload-release-assets@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          tag: ${{ needs.meta.outputs.tag }}
          assets: |
            dist/*-plugins-*.tar.gz
            dist/*-plugins-*.tar.gz.sha256

  publish_pypi_hermes:
    name: Publish Hermes plugin to PyPI
    needs: [meta, finalize_release]
    if: >-
      ${{ !inputs.plugins-only && (needs.finalize_release.result == 'success') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
      - name: Verify plugin versions and generated resources before publishing
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/sync_plugin_version.py --expect "$VERSION"
          python3 scripts/sync_public_skills.py --check
          ai-rulez verify --plugin
      - uses: xberg-io/actions/setup-mise@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          install-args: python uv
          config-ref: ${{ github.sha }}
      - name: Read the verified Hermes package version
        id: wheel-version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']
          if project['name'] != 'basemind-hermes-plugin' or not project['version']:
              raise SystemExit('Missing or unexpected Hermes package identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={project['version']}\n")
          PY
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      - name: Validate Hermes distribution metadata
        run: |
          set -euo pipefail
          wheels=(dist-hermes/*.whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
          uvx --from twine==7.0.0 --with packaging==26.3 twine check --strict "${wheels[0]}"
      - name: Verify every packaged Hermes runtime resource
        run: python3 scripts/verify_plugin_distribution.py wheel dist-hermes/*.whl
      - name: Publish verified Hermes wheel
        uses: xberg-io/actions/publish-pypi@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          expected-version: ${{ steps.wheel-version.outputs.version }}
          packages-dir: dist-hermes

  publish_homebrew:
    name: Update Homebrew formula
    needs: [meta, create_release, finalize_release]
    if: >-
      ${{ !inputs.plugins-only && (always() && needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Generate formula and push to tap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TOKEN is not set, so the Homebrew formula cannot be updated."
            exit 1
          fi
          # Resolve rather than read create_release's output: this job also runs on the
          # already-complete path, where create_release is skipped and that output is empty.
          # By now finalize_release has promoted the record, so the draft requirement is off.
          release_id="$(bash .github/scripts/release-asset.sh resolve \
            "${{ needs.meta.outputs.tag }}" false "${{ needs.create_release.outputs.release_id }}")"
          version="${{ needs.meta.outputs.version }}"
          checksums_file="basemind_${version}_checksums.txt"

          bash .github/scripts/release-asset.sh download "$release_id" "$checksums_file" checksums.txt
          ./scripts/update-homebrew-formula.sh "$version" checksums.txt > basemind.rb

          # The token goes in a per-command header, never into the clone URL that tap/.git/config keeps.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOMEBREW_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.extraheader="$auth" clone --depth 1 https://github.com/Goldziher/homebrew-tap.git tap
          cp basemind.rb tap/Formula/basemind.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/basemind.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "basemind ${version}"
            git -c http.extraheader="$auth" push
          fi

  plugin_release_report:
    name: Verify all plugin distribution jobs succeeded
    needs: [publish_plugin_artifacts, publish_plugin_npm, publish_pypi_hermes, publish_opencode]
    if: >-
      ${{ !inputs.plugins-only && (always()) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
      - name: Reject failed or skipped plugin distribution jobs
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/verify_plugin_release_results.py

  dispatch-plugin-npm:
    name: Publish missing npm plugin version
    needs: ci_gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.plugins-only && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # A registry version is immutable: publish it only from the release tag that names it, never
      # from a branch whose manifests already carry the next, untagged version.
      - name: Require the dispatched tag to name the plugin version
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("plugin/package.json"))["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::plugin version $version does not match the dispatched ref $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Install reviewed ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
      - name: Verify plugin versions and generated resources
        uses: xberg-io/actions/verify-ai-rulez-plugin@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          version-sync-script: scripts/sync_plugin_version.py
      - uses: xberg-io/actions/setup-mise@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          install-args: node pnpm
      - name: Read and check the exact npm version
        id: package
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          package = json.loads(Path('plugin/package.json').read_text())
          name, version = package['name'], package['version']
          if not name or not version:
              raise SystemExit('Missing plugin package identity')
          url = 'https://registry.npmjs.org/' + urllib.parse.quote(name, safe='')
          url += '/' + urllib.parse.quote(version, safe='')
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  published = json.load(response)
              if published['name'] != name or published['version'] != version:
                  raise SystemExit('Registry returned an unexpected package identity')
              exists = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              exists = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={version}\nexists={str(exists).lower()}\n")
              output.write(f"tag={'next' if '-' in version else 'latest'}\n")
          print(f"{name}@{version}: {'already published; skipping' if exists else 'not published'}")
          PYTHON
      - name: Verify the packed Pi and OpenCode resources
        if: steps.package.outputs.exists != 'true'
        shell: bash
        run: |
          npm pack ./plugin --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/plugin-pack.json"
          archive="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1]))[0].filename" "$RUNNER_TEMP/plugin-pack.json")"
          python3 scripts/verify_plugin_distribution.py npm "$RUNNER_TEMP/$archive"
      - name: Publish missing npm version with trusted publishing
        if: steps.package.outputs.exists != 'true'
        uses: xberg-io/actions/publish-npm@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          package-dir: plugin
          expected-version: ${{ steps.package.outputs.version }}
          npm-tag: ${{ steps.package.outputs.tag }}
          access: public
          provenance: "true"

  dispatch-plugin-hermes:
    name: Publish missing Hermes plugin version
    needs: ci_gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.plugins-only && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # A registry version is immutable: publish it only from the release tag that names it, never
      # from a branch whose manifests already carry the next, untagged version.
      - name: Require the dispatched tag to name the plugin version
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("plugin/package.json"))["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::plugin version $version does not match the dispatched ref $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Install reviewed ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
      - name: Verify plugin versions and generated resources
        uses: xberg-io/actions/verify-ai-rulez-plugin@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          version-sync-script: scripts/sync_plugin_version.py
      - uses: xberg-io/actions/setup-mise@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          install-args: python uv
      - name: Read the verified Hermes version
        id: package
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']
          if not package['name'].endswith('-hermes-plugin') or not package['version']:
              raise SystemExit('Missing or unexpected Hermes package identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={package['version']}\n")
          PYTHON
      - name: Build verified Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      - name: Verify every packaged Hermes runtime resource
        run: python3 scripts/verify_plugin_distribution.py wheel dist-hermes/*.whl
      - name: Publish missing Hermes version with trusted publishing
        uses: xberg-io/actions/publish-pypi@64bf4fc642ab473af9c6d49938173515a4adb48d # v1.51.0
        with:
          packages-dir: dist-hermes
          expected-version: ${{ steps.package.outputs.version }}
