name: hardening

# The pre-release hardening pass (docs/hardening.md) on Linux, macOS and Windows: the analyze.py
# selftest, the functional sweep, a soak judged by analyze.py's pass rules, and a one-shot leak
# check, then a large-monorepo soak on four pinned public repositories (docs/hardening.md). Nightly
# and on demand; on a pull request or a push to main only when the scripts or this workflow change,
# with a short soak and without the monorepo job, so the workflow verifies itself. The release gate
# (.github/scripts/require-green-ci.sh) needs a scheduled or dispatched run of this workflow to
# succeed, which makes the monorepo soak a release gate.

on:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Soak load phase in minutes (warm-up included)
        type: number
        default: 45
      features:
        description: Cargo features of the binary under test
        type: string
        default: full
      inject_orphan:
        description: Leak a process before the survivor sweep (proves rule R7 turns the job red)
        type: boolean
        default: false
      soak_self:
        description: Soak a clone of this repository instead of the generated fixture
        type: boolean
        default: false
      monorepo_minutes:
        description: Large-monorepo soak load phase in minutes (scenarios included)
        type: number
        default: 15
  schedule:
    - cron: "0 5 * * *"
  pull_request:
    branches: [main]
    paths:
      - scripts/hardening/**
      - scripts/harden_fetch.sh
      - .github/workflows/hardening.yaml
  push:
    branches: [main]
    paths:
      - scripts/hardening/**
      - scripts/harden_fetch.sh
      - .github/workflows/hardening.yaml

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  FEATURES: ${{ inputs.features || 'full' }}
  SOAK_MINUTES: ${{ inputs.soak_minutes || ((github.event_name == 'pull_request' || github.event_name == 'push') && 10 || 45) }}
  INJECT_ORPHAN: ${{ inputs.inject_orphan && '1' || '' }}
  SOAK_SELF: ${{ inputs.soak_self && '1' || '' }}
  MONOREPO_MINUTES: ${{ inputs.monorepo_minutes || 15 }}

jobs:
  harden:
    name: hardening / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            leak_tool: valgrind
          - os: macos-26
            leak_tool: leaks
          # ~keep windows-2022, not windows-latest: the release builds `full` there (publish.yaml) because
          # ~keep the newer MSVC on windows-latest cannot compile xberg-libwpd, so this hardens what ships.
          - os: windows-2022
            leak_tool: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ~keep The soak indexes a clone of this checkout; real history exercises the git tools.
          fetch-depth: 0

      # ~keep Same purge as ci.yaml's `full` legs: the release target dir and models exhaust the disk.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo rm -rf /usr/local/.ghcup /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/miniconda /opt/az || true
          sudo apt-get clean || true
          sudo docker image prune --all --force || true
          df -h /
      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          df -h /
      # ~keep C: has ~500 MB free on the Windows image, under the scan's pre-flight space check.
      - name: Move temp to the work drive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: ./.github/actions/setup-rust

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      # ~keep ort-sys links against libonnxruntime.a in its download dir and never reruns when that
      # ~keep dir is gone, so the dir is cached with target/ (see ci.yaml).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: hardening-${{ matrix.os }}-${{ env.FEATURES }}
          cache-directories: ${{ runner.os == 'Windows' && '~/AppData/Local/ort.pyke.io' || runner.os == 'macOS' && '~/Library/Caches/ort.pyke.io' || '~/.cache/ort.pyke.io' }}

      - uses: xberg-io/actions/setup-mise@3debc44dfd6b6a1b2b691ba553d51f13dc78d738 # v1.52.0
        with:
          install-args: python

      - name: Isolate basemind state
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "BASEMIND_DATA_HOME=$RUNNER_TEMP/bm-data"
            echo "BASEMIND_COMMS_DIR=$RUNNER_TEMP/bm-comms"
            echo "HARDENING_REPORTS=$RUNNER_TEMP/hardening-reports"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hardening-reports"

      - name: Selftest (analyze.py rules, the sweep's matchers and the monorepo soak's rules fire on known-bad input)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hardening/selftest_analyze.py --out "$HARDENING_REPORTS/selftest" 2>&1 |
            tee "$HARDENING_REPORTS/selftest.log"
          python scripts/hardening/selftest_sweep.py 2>&1 | tee "$HARDENING_REPORTS/selftest-sweep.log"
          python scripts/hardening/selftest_monorepo.py 2>&1 | tee "$HARDENING_REPORTS/selftest-monorepo.log"

      - name: Selftest (leak_check.py judges synthetic reports and a timed-out run)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hardening/selftest_leak_check.py 2>&1 | tee "$HARDENING_REPORTS/selftest-leak-check.log"

      - name: Build the binary under test
        id: build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          built="$FEATURES"
          if ! cargo build --locked --release --bin basemind --features "$FEATURES"; then
            # ~keep `full` is what ships: a leg that cannot build it must fail, not harden another binary.
            if [ "$FEATURES" = full ]; then
              echo "::error title=Build failed::cargo build --features full failed on $RUNNER_OS"
              exit 1
            fi
            echo "::warning title=Feature fallback::cargo build --features '$FEATURES' failed on $RUNNER_OS; retrying with 'comms'"
            built=comms
            cargo build --locked --release --bin basemind --features comms || exit 1
          fi
          exe="target/release/basemind"
          [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "BASEMIND_BIN=$GITHUB_WORKSPACE/$exe" >> "$GITHUB_ENV"
          echo "Binary under test on $RUNNER_OS: features '$built' (requested '$FEATURES')"
          "$exe" --version

      - name: Functional sweep (every MCP tool and its CLI command)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 45
        shell: bash
        run: |
          python scripts/hardening/functional_sweep.py --binary "$BASEMIND_BIN" \
            --features "${{ steps.build.outputs.built }}" --out "$HARDENING_REPORTS/sweep"

      - name: Soak
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # ~keep analyze.py needs >= 20 post-warm-up samples (5 s apart) and a 60 s idle window after a
          # ~keep 30 s settle, so the short PR soak keeps a 1 min warm-up and a 2 min idle.
          if [ "$SOAK_MINUTES" -ge 10 ]; then warmup=120 idle=180; else warmup=60 idle=120; fi
          extra=()
          [ -n "$INJECT_ORPHAN" ] && extra+=(--inject-orphan)
          # ~keep A `full` scan of this repository did not finish in 30 min on the 4-vCPU Linux and
          # ~keep Windows runners, so CI soaks the generated fixture unless asked for this repository.
          [ -z "$SOAK_SELF" ] && extra+=(--fixture)
          python scripts/hardening/soak.py --binary "$BASEMIND_BIN" --out "$HARDENING_REPORTS/soak" \
            --duration "$((SOAK_MINUTES * 60))" --warmup "$warmup" --idle "$idle" ${extra[@]+"${extra[@]}"}

      - name: Judge the soak (analyze.py pass rules)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          python scripts/hardening/analyze.py "$HARDENING_REPORTS/soak/soak.ndjson" \
            --json "$HARDENING_REPORTS/soak/verdict.json"

      # ~keep valgrind is a system package with no mise backend; the runner image does not ship it.
      - name: Install valgrind (Linux)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.leak_tool == 'valgrind' }}
        run: command -v valgrind || { sudo apt-get update && sudo apt-get install -y valgrind; }

      # ~keep Neither checker sees mimalloc's heap, and `leaks` reports every C block a Rust value owns
      # ~keep as unreferenced, so the leak check runs the same features on the system allocator.
      - name: Build the leak-check binary (system allocator)
        id: leak_build
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.leak_tool != '' }}
        shell: bash
        env:
          BUILT: ${{ steps.build.outputs.built }}
        run: |
          set -euo pipefail
          cargo build --locked --release --bin basemind --features "$BUILT,system-allocator"
          mkdir -p "$RUNNER_TEMP/leak-bin"
          cp target/release/basemind "$RUNNER_TEMP/leak-bin/basemind"

      # ~keep The runs go in parallel, one per core; a run past --run-timeout is killed and fails, so
      # ~keep the report is written before the step's own limit cuts the job. The grammar warm-up
      # ~keep (600 s at most) plus 2400 s leaves ten minutes for the fixtures and the report.
      - name: One-shot leak check (${{ matrix.leak_tool }})
        if: ${{ !cancelled() && steps.leak_build.outcome == 'success' }}
        timeout-minutes: 60
        shell: bash
        run: |
          python scripts/hardening/leak_check.py --binary "$RUNNER_TEMP/leak-bin/basemind" \
            --tool "${{ matrix.leak_tool }}" --run-timeout 2400 --out "$HARDENING_REPORTS/leaks"

      - name: One-shot leak check skipped (Windows)
        if: ${{ matrix.leak_tool == '' }}
        shell: bash
        run: |
          echo "::notice title=Leak check skipped::No leak checker on $RUNNER_OS (macOS uses leaks, Linux valgrind); the soak's memory rules still ran."

      - name: Job summary
        if: ${{ always() }}
        shell: bash
        run: |
          skip=()
          [ -z "${{ matrix.leak_tool }}" ] && skip=(--leaks-skipped "no leak checker on $RUNNER_OS")
          python scripts/hardening/ci_summary.py --title "${{ matrix.os }} / ${{ steps.build.outputs.built || env.FEATURES }}" \
            --reports "$HARDENING_REPORTS" ${skip[@]+"${skip[@]}"}

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardening-${{ matrix.os }}
          path: ${{ runner.temp }}/hardening-reports
          if-no-files-found: warn
          retention-days: 14

  # ~keep The soak of a large repository with many worktrees runs where the dataset fits: a 150 000-file
  # ~keep checkout, its sparse worktrees and the index of all of them need the Linux runner's disk after the
  # ~keep purge below. It is nightly and on demand, never per push; docs/hardening.md lists the rules.
  monorepo:
    name: monorepo soak / ${{ matrix.repo }}
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        repo: [llvm-project, kibana, tensorflow, terraform-provider-aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo rm -rf /usr/local/.ghcup /usr/share/swift /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/miniconda /opt/az || true
          sudo apt-get clean || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: ./.github/actions/setup-rust

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: hardening-ubuntu-latest-${{ env.FEATURES }}
          cache-directories: ~/.cache/ort.pyke.io

      - uses: xberg-io/actions/setup-mise@3debc44dfd6b6a1b2b691ba553d51f13dc78d738 # v1.52.0
        with:
          install-args: python

      - name: Isolate basemind state
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "BASEMIND_DATA_HOME=$RUNNER_TEMP/bm-data"
            echo "BASEMIND_COMMS_DIR=$RUNNER_TEMP/bm-comms"
            echo "HARDENING_REPORTS=$RUNNER_TEMP/hardening-reports"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hardening-reports"

      - name: Selftest (the monorepo soak's pins, setup and rules)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hardening/selftest_monorepo.py 2>&1 | tee "$HARDENING_REPORTS/selftest-monorepo.log"

      - name: Build the binary under test
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --bin basemind --features "$FEATURES"
          echo "BASEMIND_BIN=$GITHUB_WORKSPACE/target/release/basemind" >> "$GITHUB_ENV"
          target/release/basemind --version

      - name: Soak ${{ matrix.repo }} (20 worktrees, 30 sessions)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/hardening/monorepo_soak.py --binary "$BASEMIND_BIN" --name "${{ matrix.repo }}" \
            --out "$HARDENING_REPORTS/monorepo" --worktrees 20 --sessions 30 \
            --duration "$((MONOREPO_MINUTES * 60))"

      - name: Judge the soak (analyze_monorepo.py pass rules)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python scripts/hardening/analyze_monorepo.py "$HARDENING_REPORTS/monorepo/monorepo.ndjson" \
            --worktrees 20 --sessions 30 --json "$HARDENING_REPORTS/monorepo/verdict.json"

      - name: Job summary
        if: ${{ always() }}
        shell: bash
        run: |
          python scripts/hardening/ci_summary.py --title "monorepo soak / ${{ matrix.repo }}" \
            --reports "$HARDENING_REPORTS" --monorepo

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardening-monorepo-${{ matrix.repo }}
          path: ${{ runner.temp }}/hardening-reports
          if-no-files-found: warn
          retention-days: 14
