name: docs

# basemind.ai deploys from a release tag (`v*`), so the site documents the released binary: the
# github-pages environment admits `v*` tags and main. A push to main, a pull request or a dispatch
# only builds the site; the build fails on a broken internal link or anchor
# (starlight-links-validator in website/astro.config.mjs).
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "website/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "skills/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/docs.yaml"
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
