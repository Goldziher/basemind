name: docs

# basemind.ai deploys from a release tag (`v*`), so the site documents the released binary: the
# github-pages environment admits `v*` tags and main. A push to main, a pull request or a dispatch
# only builds the site; the build fails on a broken internal link or anchor
# (starlight-links-validator in website/astro.config.mjs).
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "website/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "skills/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/docs.yaml"
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'deploy' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: node pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: newest
        name: Deploy only the newest release tag
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tags=$(git ls-remote --tags --refs --sort=-v:refname "$REPO_URL" 'v*')
          latest=$(printf '%s\n' "$tags" | head -n1 | sed 's|.*refs/tags/||')
          if [ -z "$latest" ]; then echo "::error::the tag lookup returned no v* tags"; exit 1; fi
          if [ "$latest" = "$TAG" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "::notice::$TAG is not the newest release tag ($latest); skipping the deploy"; fi
      - id: deployment
        if: steps.newest.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
