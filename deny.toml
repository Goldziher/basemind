[graph]
targets = []
all-features = false
no-default-features = false
# The graph that ships: every release binary is built with `--features full` (xberg, lancedb, arrow).
features = ["full"]

[output]
feature-depth = 1

[advisories]
ignore = [
  # paste is unmaintained (archived, no advisory against its code); a proc-macro pulled in by
  # arrow-flight and lance-bitpacking (lancedb) and biblatex (xberg). Drop it once they move off it.
  "RUSTSEC-2024-0436",
  # fxhash is unmaintained; used by our stack-graphs fork (crates/stack-graphs). Replacing it there
  # needs a new version of the fork on crates.io.
  "RUSTSEC-2025-0057",
  # unsafe-libyaml is unmaintained; pulled in only by serde_yaml_ng via lindera -> lance-tokenizer.
  "RUSTSEC-2024-0449",
  # chrono (2026-0543) and chrono-tz (2026-0542) are unmaintained, with no replacement release: chrono
  # comes in through rmcp and schemars, chrono-tz through arrow-array (lancedb). humantime (2026-0555)
  # is unmaintained and comes in through lance and object_store. None is a direct dependency; drop each
  # once the crates that pull it in move off it.
  "RUSTSEC-2026-0542",
  "RUSTSEC-2026-0543",
  "RUSTSEC-2026-0555",
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "BSL-1.0",
  "0BSD",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "zstd-sys"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "zstd-safe"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "zstd"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "nucleo-matcher"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "uluru"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "colored"
allow = ["MPL-2.0"]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# crates.io refuses a crate with a git or other-registry dependency, so one fails here, not on
# release day. Cargo.lock uses crates.io only; allow a new source here deliberately.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
