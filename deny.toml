[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  "RUSTSEC-2025-0119",
  "RUSTSEC-2024-0436",
  "RUSTSEC-2025-0134",
  "RUSTSEC-2025-0057",
  # bincode 1.3.3 is unmaintained but declared complete; pulled in only by rmux-proto.
  "RUSTSEC-2025-0141",
  # unsafe-libyaml is unmaintained; pulled in only by serde_yaml_ng via lindera -> lance-tokenizer.
  "RUSTSEC-2024-0449",
  # zip 8.6.0 extraction flaws (SUID bits, symlink targets, permissions through symlinks, and the
  # 2026-0429 symlink-extract abort: `extract` reserves the symlink-target buffer from the declared
  # central-directory size). Pulled in only by calamine 0.36.1 (latest compatible, via xberg 1.3.10,
  # which pins calamine ^0.36.1) to read spreadsheets; neither call site invokes `extract`, calamine
  # 0.38.0 carries the fix but requires an xberg release, and calamine 0.38 moves zip to ^9. Drop the
  # whole block once xberg takes calamine 0.38.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0429",
  # calamine 0.36.1 CFB/OLE2 parser panic + unbounded allocation on malformed `.xls`/`.xlsb`; reachable only
  # through calamine's reader API, which basemind exercises through document RAG's spreadsheet parsing with
  # the same 0.38.0 fix blocked by the xberg ^0.36.1 pin above. Drop alongside the zip block.
  "RUSTSEC-2026-0436",
  # zstd 0.13.3 / zstd-safe 7.3.0 stream-context reuse, Seekable length and legacy-frame flaws. Pulled in only by
  # arrow-ipc 58 (via lancedb 0.41.0 -> arrow ^58), which pins zstd ^0.13; 0.13.3 and 7.3.0 are the last releases of
  # those lines, and only arrow-ipc 60 moves to the patched zstd 0.14. Drop these once lancedb takes arrow 60.
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0403",
  # astral-tl 0.8.1 unmaintained (deprecated 2026-10-05), pulled in via crawlberg 1.12.x. No safe upgrade:
  # astral ships astral-html as the replacement; drop when crawlberg replaces astral-tl or publishes its fix.
  "RUSTSEC-2026-0444",
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "BSL-1.0",
  "0BSD",
  "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "zstd-sys"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "zstd-safe"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
name = "zstd"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "nucleo-matcher"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "uluru"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "colored"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[[licenses.exceptions]]
name = "inferno"
allow = ["CDDL-1.0"]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
