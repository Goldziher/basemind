# Generated by scripts/migrate_to_poly.py from .pre-commit-config.yaml + tool configs. Review before committing.

[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
  "/.mcp.json",
  "/opencode.json",
  "/plugin/**",
  "/skills/**",
  "**/*.lock",
  "**/*.svg",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".basemind/**",
  # Generated AI-RULEZ bundles (three copies of the hermes plugin). Regenerated
  # on every `release-bump.sh`; linting them is a loop with the generator.
  ".hermes/**",
  # Agent Plugins manifests written by `ai-rulez generate --plugin`.
  "plugin.json",
  "mcp.json",
  "dist/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "website/dist/**",
  "website/node_modules/**",
  "website/.astro/**",
  "schema/basemind-config-v1.schema.json",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
]

[lint.markdown.rumdl]
disable = ["MD025", "MD013", "MD024", "MD033", "MD036", "MD041"]

# The ADR log is docs/adr (the engine default). `adrlint.lock` pins the accepted records
# (`adrlint lock docs/adr`, configured by `.adrlint.toml`). The records keep the Nygard section names
# (`## Decision`, `## Consequences`, `## Alternatives considered`), so the three MADR rules that
# demand `## Decision Outcome`, `## Considered Options` and a level-3 `### Consequences` are off;
# every other document and numbering rule runs.
# MADR31 wants `*` bullets, which `poly fmt` rewrites to `-`; poly before 0.34 has it on by default.
[lint.markdown.adrlint]
enabled = true
start = 0
ignore = ["MADR01c", "MADR01d", "MADR06", "MADR31"]

# The quality tier's budgets are tuned to this repo's reality: the MCP/CLI
# handlers are long by construction, most ships in vendored tree-sitter crates,
# and the test suite exercises monoliths end-to-end. The remaining flags (>500
# lines, >12 params, nesting ~7) are the genuinely problematic ones.
[lint.quality]
function_too_long_lines = 500
file_too_long_lines = 1500
type_too_long_lines = 400
too_many_parameters_count = 12
nesting_too_deep_depth = 6
cyclomatic_complexity_max = 40

# oxc noise that is deliberate in shipped scripts/plugins: a CLI's `console` is
# its output interface, and the hook/extension callbacks are async by contract.
[lint.javascript.oxc]
ignore = ["no-console", "require-await", "unicorn/prefer-import-meta-properties", "unicorn/prefer-top-level-await"]

[lint.typescript.oxc]
ignore = ["require-await", "unicorn/prefer-import-meta-properties"]


[lint.uncomment]
enabled = true
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = [
  "SAFETY",
  "HACK",
  "WORKAROUND",
  "NOTE",
  "Copyright",
  "Licensed",
  "License",
  "SPDX",
  "Apache",
  "MIT",
  "WITHOUT WARRANTIES",
  "limitations under the License",
  "copyright",
  "licensed",
  "license",
  "apache",
  "you may not use this file except in compliance",
  "You may obtain a copy of the License",
  "you may obtain a copy of the license",
  "http://www.apache.org/licenses/LICENSE-2.0",
  "http://www.apache.org/licenses/license-2.0",
  "Unless required by applicable law",
  "unless required by applicable law",
  "distributed under the License",
  "distributed under the license",
  "AS IS",
  "as is",
  "without warranties",
  "specific language governing permissions",
  "limitations under the license",
]
[fmt.markdown.rumdl]
disable = ["MD025", "MD013", "MD024", "MD033", "MD036", "MD041"]

[lint.typos]
extend_words = { patern = "patern", pattrn = "pattrn", ser = "ser", certifi = "certifi", ratatui = "ratatui", Ratatui = "Ratatui" }
extend_identifiers = { rela_path = "rela_path" }
extend_exclude = ["tests/fixtures/**"]

[per-file-ignores]
"e2e/**" = ["comment", "doc-comment"]
"**/e2e/**" = ["comment", "doc-comment"]
"test_apps/**" = ["comment", "doc-comment"]
"**/test_apps/**" = ["comment", "doc-comment"]
"docs/assets/**" = ["comment", "doc-comment"]
"**/generated/**" = ["comment", "doc-comment"]
"**/*.generated.*" = ["comment", "doc-comment"]
"**/*.g.*" = ["comment", "doc-comment"]
"**/*.freezed.*" = ["comment", "doc-comment"]
"crates/*-ffi/include/*.h" = ["comment", "doc-comment"]
"packages/go/include/*.h" = ["comment", "doc-comment"]
"Package.swift" = ["comment", "doc-comment"]
# Vendored tree-sitter/stack-graphs forks and long test suites: flagged by the
# quality tier but not ours to refactor.
"crates/stack-graphs/**" = [
  "function-too-long",
  "file-too-long",
  "too-many-parameters",
  "nesting-too-deep",
  "cyclomatic-complexity",
  "type-too-long",
]
"crates/tree-sitter-graph/**" = [
  "function-too-long",
  "file-too-long",
  "too-many-parameters",
  "nesting-too-deep",
  "cyclomatic-complexity",
  "type-too-long",
]
"crates/tree-sitter-stack-graphs/**" = [
  "function-too-long",
  "file-too-long",
  "too-many-parameters",
  "nesting-too-deep",
  "cyclomatic-complexity",
  "type-too-long",
]
"tests/**" = [
  "function-too-long",
  "file-too-long",
  "too-many-parameters",
  "nesting-too-deep",
  "cyclomatic-complexity",
  "type-too-long",
]
"crates/*/tests/**" = [
  "function-too-long",
  "file-too-long",
  "too-many-parameters",
  "nesting-too-deep",
  "cyclomatic-complexity",
  "type-too-long",
]
"**/*_tests.rs" = [
  "function-too-long",
  "file-too-long",
  "too-many-parameters",
  "nesting-too-deep",
  "cyclomatic-complexity",
  "type-too-long",
]
# Ruff noise that is not actionable: missing annotations in test specs, and the
# hermes plugin package which mirrors ai-rulez-generated content.
"pip-package/tests/**" = ["ANN", "ARG"]
"pip-package/basemind/downloader.py" = ["T201", "PERF203", "C901", "PLR0912", "PLR0915"]
"pip-package-hermes/**" = ["ANN", "ARG", "BLE001", "S110", "SIM105", "PERF203", "PTH109", "TRY300", "T201"]
"tests/fixtures/**" = ["ANN", "C416", "RET504", "PERF203"]
# CHANGELOG.md accumulates release notes without bound; length is intentional.
"CHANGELOG.md" = ["file-too-long"]
# The template shares number 0000 with the first record. adrlint reports a duplicate number on
# every file that carries it, so exactly this pair is exempt; a third 0000 file is still reported.
"docs/adr/0000-record-architecture-decisions.md" = ["MADR43"]
"docs/adr/0000-template.md" = ["MADR43"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = [
  "/.mcp.json",
  "/opencode.json",
  "/plugin/**",
  "/skills/**",
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".basemind/**",
  "dist/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
fmt = { exclude = [
  "/.mcp.json",
  "/opencode.json",
  "/plugin/**",
  "/skills/**",
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".basemind/**",
  "dist/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "schema/basemind-config-v1.schema.json",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
  "/.mcp.json",
  "/opencode.json",
  "/plugin/**",
  "/skills/**",
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  ".basemind/**",
  "dist/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
] }
cargo = true

[tools.shfmt]
enabled = true

[tools.shellcheck]
enabled = true

# Scoped to what the smoke test exercises: the statusline script, the plugin manifest it reads
# the version from, and the sources of `basemind statusline` and the status.json sidecar. It may
# build the binary, so it shares the cargo exclusion set.
[hooks.pre-commit.scripts.statusline_smoke]
run = "bash tests/statusline_smoke.sh"
glob = [
  ".claude-plugin/plugin.json",
  ".claude-plugin/statusline.sh",
  "src/comms_cli.rs",
  "src/store_layout.rs",
  "tests/statusline_smoke.sh",
]
serial = "cargo"

[hooks.pre-commit.scripts.sync_plugin_skills]
run = "python3 scripts/sync_legacy_plugin_exports.py --check"
workspace = true
[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v5"
hooks = ["ai-rulez-validate", "ai-rulez-plugin-verify"]
