[plugin]
name = "basemind"
version = "0.33.0"
display_name = "basemind"
# ~keep overridden from the generator default (^2.0.26) so the bundled OpenCode
# SDK tracks the current 2.x release.
opencode_dependency = "^2.2.5"
description = "Coding agents ask a local index of your code, git history, documents and memory over MCP or the CLI, get paths and lines instead of reading files, and coordinate in shared threads."
homepage = "https://basemind.ai"
repository = "https://github.com/Goldziher/basemind"
license = "MIT"
category = "developer-tools"
logo = "assets/basemind-logo.png"
icon = "assets/basemind-icon.svg"
brand_color = "#965aff"
keywords = ["mcp", "agent-context", "rag", "code-map", "tree-sitter"]
tags = ["mcp", "code-intelligence", "rag", "tree-sitter", "git", "embeddings"]
# ~keep no "cursor": the repository-root .cursor-plugin/ is the one Cursor imports, and the
# generated tree would resolve hook scripts against the session directory when
# CURSOR_PLUGIN_ROOT is unset.
runtimes = ["claude", "codex", "gemini", "kimi", "opencode", "factory", "hermes", "pi", "agent-plugins", "copilot"]
spec = "1.0.0"
include = ["assets/**", "hooks/**", "scripts/**", "LICENSE"]

[plugin.author]
name = "Na'aman Hirschfeld"
email = "nhirschfeld@gmail.com"
url = "https://github.com/Goldziher"

[[plugin.mcp]]
name = "basemind"
command = "${PLUGIN_ROOT}/scripts/mcp-launch.cmd"
args = ["serve"]

[plugin.interface]
display_name = "basemind"
short_description = "The context and communication layer for coding agents"
long_description = "Coding agents ask a local index of your code, git history, documents and memory over MCP or the CLI, get paths and lines instead of reading files, and coordinate in shared threads."
developer_name = "Na'aman Hirschfeld"
category = "Developer Tools"
capabilities = ["Interactive", "Read"]
default_prompt = ["Outline this file.", "What calls `<symbol>` in this repo?", "Where is `<symbol>` defined?", "What changed in this file in the last 20 commits?"]
website_url = "https://basemind.ai"
brand_color = "#965aff"
composer_icon = "assets/basemind-icon.svg"
logo = "assets/basemind-logo.png"

[plugin.hermes]
requires_python = ">=3.11"
dependencies = ["mcp==1.30.0", "PyYAML==6.0.3"]


[plugin.codex]
manifest = "both"
marketplace = true

[plugin.gemini]
commands = true
context_file_name = "assets/GEMINI.md"

[plugin.kimi]
session_start_skill = "basemind"

[plugin.pi]
package_json = "merge"
package_name = "@goldziher/basemind-plugin"

[[plugin.hooks]]
event = "SessionStart"
matcher = "startup|resume|clear|compact"
[[plugin.hooks.hooks]]
type = "command"
command = "\"${PLUGIN_ROOT}/hooks/run-hook.cmd\" session-start"

[[plugin.hooks]]
event = "PreToolUse"
matcher = "Grep|Glob|Bash"
[[plugin.hooks.hooks]]
type = "command"
command = "\"${PLUGIN_ROOT}/hooks/run-hook.cmd\" pre-tool-guard"

[[plugin.hooks]]
event = "PreToolUse"
matcher = "mcp__.*basemind.*__agent_(post|inbox|threads)"
[[plugin.hooks.hooks]]
type = "command"
command = "\"${PLUGIN_ROOT}/hooks/run-hook.cmd\" agent-as"

[[plugin.hooks]]
event = "UserPromptSubmit"
[[plugin.hooks.hooks]]
type = "command"
command = "\"${PLUGIN_ROOT}/hooks/run-hook.cmd\" inbox-notify"
