[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basemind"
version = "0.33.0"
description = "Coding agents ask a local index of your code, git history, documents and memory over MCP or the CLI, get paths and lines instead of reading files, and coordinate in shared threads."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Na'aman Hirschfeld", email = "nhirschfeld@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Code Generators",
  "Environment :: Console",
]
keywords = ["mcp", "agent-context", "rag", "code-map", "tree-sitter"]
requires-python = ">=3.11"
dependencies = ["certifi>=2026.10.23"]

[project.urls]
Homepage = "https://basemind.ai"
Documentation = "https://basemind.ai"
Repository = "https://github.com/Goldziher/basemind.git"
Issues = "https://github.com/Goldziher/basemind/issues"

[project.scripts]
basemind = "basemind.cli:main"

[tool.setuptools]
packages = ["basemind"]
