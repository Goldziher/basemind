version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: "Install all dependencies and initialize project. Idempotent."
    cmds:
      - cargo fetch
      - poly hooks install
      - echo "Setup complete"

  build:
    desc: Build the basemind binary
    cmds:
      - cargo build --release

  test:
    desc: Run all tests
    cmds:
      - cargo test --workspace --no-fail-fast
      - task: hermes:test

  hermes:test:
    desc: Validate and build the generated Hermes plugin package
    cmds:
      - uv run --no-project --with pytest --with mcp==1.28.1 python -m pytest pip-package-hermes/tests
      - |
        wheel_dir="$(mktemp -d)"
        trap 'rm -rf "$wheel_dir"' EXIT
        uv build --wheel --out-dir "$wheel_dir" plugin/.hermes/package

  plugin:generate:
    desc: Generate native plugins and all public compatibility exports
    cmds:
      - python3 scripts/sync_plugin_version.py
      - bash scripts/sync-plugin-skills.sh

  plugin:test:
    desc: Exercise archive, public export, and actual CLI integration contracts
    cmds:
      - uv run --no-project --with pytest --with mcp==1.28.1 python -m pytest scripts/tests tests/test_legacy_plugin_exports.py pip-package-hermes/tests
      - node tests/basemind_pi_cli_contract.mjs

  plugin:hermes:native:test:
    desc: Verify required registration using the installed Hermes SDK
    vars:
      HERMES_PYTHON: '{{.HERMES_PYTHON | default "python3"}}'
    preconditions:
      - sh: '{{.HERMES_PYTHON}} -c "import hermes_cli.plugins"'
        msg: Set HERMES_PYTHON to the Python interpreter containing the Hermes Agent SDK.
    cmds:
      - '{{.HERMES_PYTHON}} scripts/tests/native_hermes_registration.py'

  plugin:verify:
    desc: Verify native plugin and public export freshness
    cmds:
      - python3 scripts/sync_plugin_version.py --check
      - ai-rulez verify --plugin
      - python3 scripts/sync_public_skills.py --check
      - python3 scripts/sync_legacy_plugin_exports.py --check

  package:plugin:
    aliases: [package:pi]
    desc: Stage and pack the combined OpenCode and Pi package without changing the checkout
    cmds:
      - |
        package_dir="$(mktemp -d)"
        trap 'rm -rf "$package_dir"' EXIT
        bash scripts/stage-agent-package.sh "$package_dir"
        pnpm --dir "$package_dir" pack --pack-destination "$package_dir"

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - cargo test --workspace --no-fail-fast -- --nocapture

  lint:
    desc: Run all linters and formatters via poly
    cmds:
      - poly lint .

  format:
    desc: Format code
    cmds:
      - cargo fmt --all

  check:
    desc: Run all checks (lint + test)
    cmds:
      - task: lint
      - task: test

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean

  update:
    desc: Update dependencies (compatible versions only — no Cargo.toml edits)
    cmds:
      - cargo update

  upgrade:
    desc: Upgrade dependencies to latest, including incompatible bumps (rewrites Cargo.toml)
    cmds:
      - cargo upgrade --incompatible
      - cargo update

  harden:
    desc: Run the real-OSS hardening harness against all canary repos
    cmds:
      - ./scripts/harden.sh

  demo:record:
    desc: "Record the CLI demo to an asciinema cast and render docs/media/demo.gif (needs asciinema + agg)"
    cmds:
      - ./scripts/demo-record.sh

  release:sync-version:
    desc: "Sync version across every shipped surface (Cargo, npm wrappers, PyPI, plugin manifests). Usage: task release:sync-version VERSION=0.1.0"
    cmds:
      - ./scripts/release-bump.sh "{{.VERSION}}"
      - cargo test --test config_schema --features full -- --ignored regenerate_schema
    requires:
      vars: [VERSION]

  release:dry-run:
    desc: "Dry-run the real release packaging path for the host platform (build + package-release.sh + checksums + launcher smoke)"
    cmds:
      - ./scripts/release-dry-run.sh
