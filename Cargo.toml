
[package]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/src/**",
  "/README.md",
  "/docs/manual/*.md",
  "/LICENSE",
  "/ATTRIBUTIONS.md",
  "/build.rs",
  "!/src/watcher_tests.rs",
  "!/src/comms/client_tests.rs",
  "!/src/comms/workspace_pool_tests.rs",
  "!/src/comms/daemon_tests.rs",
  "!/src/comms/daemon_forward_tests.rs",
  "!/src/comms/generation_cleanup_tests.rs",
  "!/src/comms/singleton_tests.rs",
  "!/src/comms/singleton_takeover_tests.rs",
  "!/src/comms/singleton_takeover_decision_tests.rs",
  "!/src/comms/singleton_endpoint_windows_tests.rs",
  "!/src/stdio_relay_tests.rs",
  "!/src/stdio_relay_offline_tests.rs",
  "!/src/mcp/lazy_cache_tests.rs",
  "!/src/mcp/find_files_tests.rs",
]
name = "basemind"
version = "0.34.0"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
edition = "2024"
rust-version.workspace = true
description = "Coding agents ask a local index of your code, git history, documents and memory over MCP or the CLI, get paths and lines instead of reading files, and coordinate in shared threads."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Goldziher/basemind"
documentation = "https://docs.rs/basemind"
homepage = "https://basemind.ai"
keywords = ["mcp", "agent-context", "rag", "code-map", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

# docs.rs builds without network access. tree-sitter-language-pack's build script downloads its
# parser sources unless TSLP_OFFLINE is set, and the documentation needs none of them. CI's
# `docs.rs build` job runs `cargo doc` offline with these arguments.
[package.metadata.docs.rs]
cargo-args = ["--config", 'env.TSLP_OFFLINE="1"']

[workspace]
# ~keep The embed check is a downstream crate of its own workspace (its CI job builds it apart).
exclude = ["crates/engine-embed"]
members = [
  "crates/basemind-agents",
  "crates/basemind-engine",
  "crates/lsp-positions",
  "crates/stack-graphs",
  "crates/tree-sitter-graph",
  "crates/tree-sitter-stack-graphs",
]

# ~keep The oldest Rust every published crate builds with: the toolchain pin in rust-toolchain.toml when
# ~keep it was set. The `msrv` CI job checks the crates with exactly this release.
[workspace.package]
rust-version = "1.100.0"

[workspace.dependencies]
agent-client-protocol = "5.5.1"

[workspace.lints.clippy]
all = "warn"

[lib]
name = "basemind"
path = "src/lib.rs"

[[bin]]
name = "basemind"
path = "src/main.rs"

[features]
default = []

intelligence = ["basemind-engine/intelligence", "dep:xberg", "dep:lancedb", "dep:futures"]

# Just the real o200k tokenizer (`xberg::chunking::count_tokens`), used by `basemind admin tokens`
# and `src/engine/savings.rs`. `xberg/chunking-tokenizers` is a pure-Rust `tokenizers` crate underneath
# (no LanceDB/Arrow/OCR/ONNX), so this is deliberately its own feature rather than riding on
# `intelligence` — it stays cheap enough to build without also pulling in the vector-store deps.
tokenizer = ["basemind-engine/tokenizer", "dep:xberg"]

# Document RAG on local files: PDF text layers, Office, spreadsheets, email, HTML, XML (SVG text
# included), Markdown/MDX and notebooks (`xberg/office` carries `notebook`). xberg's `formats` and
# `analysis` umbrellas are deliberately not used: they also pull in archives, sqlite, svg
# rasterisation, wordperfect, hwp, iwork and diff, none of which basemind reaches. HEIC is the
# `documents-heic` tier.
documents = ["basemind-engine/documents", "intelligence", "tokenizer"]

# Tesseract OCR for images and PDFs with no text layer. Its own tier because it compiles leptonica
# and tesseract from source through cmake.
documents-ocr = ["basemind-engine/documents-ocr", "documents"]

# PaddleOCR as an extra OCR stage. Opt-in for source builds, never part of `full`.
documents-ocr-paddle = ["basemind-engine/documents-ocr-paddle", "documents-ocr"]

# HEIC/HEIF photos, decoded through libheif (with libde265) and then OCR'd like any raster image.
# Its own tier because it links the system libheif dynamically.
documents-heic = ["basemind-engine/documents-heic", "documents-ocr"]

# ONNX named-entity recognition: `[documents.ner]` and the `entity` filter of `docs_search`.
documents-ner = ["basemind-engine/documents-ner", "documents"]

code-search = ["basemind-engine/code-search", "intelligence"]

memory = ["basemind-engine/memory", "intelligence"]

comms = [
  "basemind-engine/comms",
  "dep:basemind-agents",
  "dep:hyper",
  "dep:hyper-util",
  "dep:http",
  "dep:http-body-util",
  "dep:bytes",
  "dep:form_urlencoded",
  "dep:getrandom",
  "rmcp/transport-streamable-http-server",
]

code-intel-js = ["basemind-engine/code-intel-js"]

code-intel-stack = ["basemind-engine/code-intel-stack"]

# Python imports resolved by ty's module resolver (`src/intel/resolver_python_ty.rs`) before the
# `code-intel-stack` path arithmetic, which stays the fallback. Default and `code-intel-stack`-only builds
# omit it; `code-intel` and `full` include it. It adds salsa and ruff's parser and AST crates to the binary.
code-intel-python = ["basemind-engine/code-intel-python", "code-intel-stack"]

code-intel = ["code-intel-js", "code-intel-stack", "code-intel-python"]

full = ["documents", "documents-ocr", "documents-heic", "documents-ner", "memory", "comms", "code-intel", "code-search"]

test-support = ["basemind-engine/test-support"]

# The system allocator instead of mimalloc (`src/allocator.rs`), for leak checking only
# (`scripts/hardening/leak_check.py`): macOS `leaks` scans the malloc zones, and mimalloc registers
# none, so on a mimalloc build every C allocation a Rust value owns looks unreferenced and a
# Rust-heap leak is invisible. Never shipped: every other feature set installs mimalloc.
system-allocator = []

[dependencies]
ahash = "0.8"
anstream = "1.0"
anstyle = "1"
anyhow = "1"
basemind-engine = { version = "0.34.0", path = "crates/basemind-engine" }
blake3 = "1"
# Streamable-HTTP MCP front-end (comms daemon only): response bodies + query parsing + hyper server. ~keep
bytes = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
directories = "6"
fjall = "3.1.13"
form_urlencoded = { version = "1", optional = true }
fs2 = "0.4"
futures = { version = "0.3", optional = true }
# OS CSPRNG for the comms daemon's HTTP bearer token. Already in the graph via ahash, so this adds ~keep
# no build cost; a hand-rolled seed mix would be rolling our own crypto for a credential. ~keep
getrandom = { version = "0.4", features = ["std"], optional = true }
gix = { version = "0.91.0", features = ["status", "blob-diff", "revision", "max-performance"] }
hex = "0.4"
# Loopback-TCP hyper server hosting the streamable-HTTP MCP transport (comms daemon only). ~keep
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"], optional = true }
ignore = "0.4"
# ~keep `remote` is enabled only because lancedb 0.38-0.41 do not compile without it: `error.rs`
# ~keep gates `Error::Http` behind `#[cfg(feature = "remote")]` while `job.rs` uses it unconditionally.
# ~keep It pulls tonic/arrow-flight/reqwest in but nothing is invoked; drop it once upstream fixes the gate.
# ~keep Arrow is never a direct dependency: `src/lance` takes it from `lancedb::arrow`, so schema and array
# types always share LanceDB's identity. A separate Arrow major forks them and breaks `Scannable`/`Schema`. ~keep
lancedb = { version = "0.41.0", features = ["remote"], optional = true }
libc = "0.2"
memchr = "2"
notify = "9"
notify-debouncer-full = "0.8"
rayon = "1"
regex = "1.13.2"
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "schemars", "transport-async-rw"] }
rmp-serde = "1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "io-util",
  "io-std",
  "time",
  "net",
  "fs",
  "process",
] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xberg = { version = "1.5.1", default-features = false, features = ["tokio-runtime", "simd-utf8"], optional = true }
zstd = "0.14.4"

# ~keep `basemind serve --lead` (ADR-0040) hosts the agent-launch supervisor; launching is Unix-only.
[target.'cfg(unix)'.dependencies]
basemind-agents = { version = "0.34.0", path = "crates/basemind-agents", optional = true }

[dev-dependencies]
basemind = { path = ".", features = ["test-support"] }
criterion = { version = "0.8", features = ["html_reports"] }
dunce = "1"
memmap2 = "0.9"
proc-macro2 = "1"
proptest = "1"
rmcp = { version = "3.11", features = ["client", "transport-async-rw", "transport-child-process"] }
syn = { version = "3", features = ["full", "visit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true

# ~keep `version::build_id` streams the whole executable (~1.3 GB in a debug build) through blake3;
# ~keep unoptimized that takes 10+ s and tripped the comms request timeouts in debug test runs.
[profile.dev.package.blake3]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# ~keep The aarch64-apple-darwin release link sits on a hard cliff. The `full` binary's `__text`
# ~keep reached ~161MB; `xet-runtime` (xberg -> hf-hub -> hf-xet) registers a static constructor,
# ~keep which LLVM emits into `__text_startup`, and ld64 places that section AFTER `__text`. An
# ~keep arm64 B/BL reaches +/-128MB and no branch island can be inserted past the end of the
# ~keep section, so the link failed outright: "ld: B/BL out of range -135343732". The branch has to
# ~keep span from the end of `__text` back to a callee ~26MB in, so the gap shrinks with total size
# ~keep and clearing it needs better than a 5% cut -- a token trim would not hold.
# ~keep The two obvious levers are both unavailable. `lto = "fat"` exhausted the 16GB on
# ~keep ubuntu-latest and the runner was killed mid-link (exit 143). `panic = "abort"` would cut
# ~keep more still, but `scanner_lanes` uses `catch_unwind` to contain a panicking parse to one file
# ~keep rather than lose the whole scan.
# ~keep So dependencies build for size. The scan hot path is exempted below and keeps opt-level 3.
[profile.release.package."*"]
opt-level = "s"

# ~keep Measured hot path (see the scan flamegraph): tree-sitter parsing, the fjall/lsm-tree commit
# ~keep path, and the hashing and scatter-gather around them. These stay at full speed.
[profile.release.package.tree-sitter]
opt-level = 3

[profile.release.package.tree-sitter-language-pack]
opt-level = 3

[profile.release.package.fjall]
opt-level = 3

[profile.release.package.lsm-tree]
opt-level = 3

[profile.release.package.blake3]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.regex]
opt-level = 3

[profile.release.package.rayon]
opt-level = 3

# ~keep Not perf tuning -- correctness. cmake-rs derives CMAKE_BUILD_TYPE from opt-level, so "s"
# ~keep silently builds these as MinSizeRel. xberg-tesseract then installs leptonica under that
# ~keep config while tesseract still configures -DCMAKE_BUILD_TYPE=Release, its exported target
# ~keep stops resolving, and the build script dies in check_leptonica_tiff_support with
# ~keep "IMPORTED_LOCATION not set for imported target leptonica". Only the `full` Windows build
# ~keep compiles tesseract, so CI's `comms` leg cannot catch this -- publish is where it lands.
[profile.release.package.xberg-tesseract]
opt-level = 3

[profile.release.package.aws-lc-sys]
opt-level = 3

# ~keep Also not perf tuning. xberg's own workspace pins `zip` because it miscompiles into a SIGBUS
# ~keep on macOS ARM64 above opt-level 2. Cargo profiles only apply from the workspace ROOT, so
# ~keep building xberg as a dependency here silently drops that pin; the `package."*"` size override
# ~keep above would otherwise compile it past the safe level. Office and spreadsheet files are zips.
[profile.release.package.zip]
opt-level = 2

