
[package]
name = "basemind"
version = "0.25.2"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
edition = "2024"
description = "Full AI context layer over MCP — tree-sitter code-map, document RAG (PDF/Office/HTML/email + OCR + reranker), shared agent memory, on-demand web crawl, git history + blame + per-symbol diff. 300+ languages, 10+ coding-agent harnesses, content-addressed Fjall + LanceDB."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Goldziher/basemind"
documentation = "https://docs.rs/basemind"
homepage = "https://basemind.ai"
keywords = ["mcp", "agent-context", "rag", "code-map", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.cargo-machete]
ignored = ["serde_toon_format"]
[workspace]
members = [
  "crates/basemind-agent",
  "crates/basemind-agent-ipc",
  "crates/basemind-tui",
  "crates/basemind-ui",
  "crates/lsp-positions",
  "crates/stack-graphs",
  "crates/tree-sitter-graph",
  "crates/tree-sitter-stack-graphs",
]

[workspace.lints.clippy]
all = "warn"

[lib]
name = "basemind"
path = "src/lib.rs"

[[bin]]
name = "basemind"
path = "src/main.rs"

[features]
default = []

intelligence = ["dep:xberg", "dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures"]

documents = [
  "intelligence",
  "xberg/formats",
  "xberg/analysis",
  "xberg/chunking-tokenizers",
  "xberg/embeddings",
  "xberg/reranker",
  "xberg/reranker-presets",
  "xberg/ocr",
  "xberg/paddle-ocr",
  "xberg/layout-detection",
  "xberg/auto-rotate",
  "xberg/ner-onnx",
  "xberg/keywords-yake",
  "xberg/keywords-rake",
  "xberg/summarization",
  "xberg/summarization-llm",
  "xberg/redaction",
  "xberg/qr-codes",
  "dep:serde_toon_format",
]

code-search = ["intelligence", "xberg/embeddings", "xberg/reranker", "xberg/reranker-presets"]

memory = ["intelligence", "xberg/embeddings", "xberg/keywords", "xberg/ner-onnx"]

crawl = ["documents", "dep:crawlberg", "dep:url"]

comms = [
  "dep:tokio-util",
  "dep:hyper",
  "dep:hyper-util",
  "dep:http",
  "dep:http-body-util",
  "dep:bytes",
  "dep:form_urlencoded",
  "dep:getrandom",
  "rmcp/transport-streamable-http-server",
]

shells = ["dep:rmux-sdk", "dep:rmux-server", "dep:rmux-client"]

code-intel-js = [
  "dep:oxc_allocator",
  "dep:oxc_parser",
  "dep:oxc_semantic",
  "dep:oxc_span",
  "dep:oxc_syntax",
  "dep:oxc_resolver",
]

code-intel-stack = ["dep:stack-graphs", "dep:tree-sitter-graph", "dep:tree-sitter-stack-graphs"]

code-intel = ["code-intel-js", "code-intel-stack"]

# The two interactive front-ends are not released yet. Each gates only the launcher subcommand in
# this crate — the front-ends themselves are separate, unpublished workspace crates
# (`crates/basemind-tui`, ratatui; `crates/basemind-ui`, tauri). Deliberately absent from `full`, so
# neither the release archive nor the crates.io build advertises a command whose sibling binary it
# does not ship. `cargo build --workspace` still compiles both crates, so they cannot bit-rot.
agent-tui = []
desktop-ui = []

full = ["documents", "memory", "crawl", "comms", "shells", "code-intel", "code-search"]

test-support = ["dep:tempfile"]

ort-dynamic = ["xberg?/ort-dynamic"]

[dependencies]
ahash = "0.8"
anstream = "1.0"
anstyle = "1"
anyhow = "1"
arc-swap = "1.9.2"
# Pinned to match LanceDB's transitive arrow: lancedb 0.33 -> lance 9 -> datafusion 54 -> arrow 58.
# Bumping past 58 forks arrow into two versions and breaks Scannable/Schema type identity. ~keep
arrow-array = { version = "=58", optional = true }
arrow-schema = { version = "=58", optional = true }
blake3 = "1"
bstr = { version = "1", features = ["serde"] }
# Streamable-HTTP MCP front-end (comms daemon only): response bodies + query parsing + hyper server. ~keep
bytes = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"] }
crawlberg = { version = "1.4.2", default-features = false, features = ["native-runtime"], optional = true }
directories = "6"
fjall = "3.1.10"
form_urlencoded = { version = "1", optional = true }
fs2 = "0.4"
futures = { version = "0.3", optional = true }
# OS CSPRNG for the comms daemon's HTTP bearer token. Already in the graph via ahash, so this adds ~keep
# no build cost; a hand-rolled seed mix would be rolling our own crypto for a credential. ~keep
getrandom = { version = "0.3", features = ["std"], optional = true }
gix = { version = "0.87.1", features = ["status", "blob-diff", "revision", "max-performance-safe"] }
globset = "0.4"
hex = "0.4"
# Loopback-TCP hyper server hosting the streamable-HTTP MCP transport (comms daemon only). ~keep
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"], optional = true }
ignore = "0.4"
jsonschema = "0.52"
lancedb = { version = "0.37", optional = true }
libc = "0.2"
lru = "0.18.3"
memchr = "2"
notify = "8"
notify-debouncer-full = "0.7"
nucleo-matcher = "0.3.1"
oxc_allocator = { version = "=0.138.0", optional = true }
oxc_parser = { version = "=0.138.0", optional = true }
oxc_resolver = { version = "=11.23.0", optional = true }
oxc_semantic = { version = "=0.138.0", optional = true }
oxc_span = { version = "=0.138.0", optional = true }
oxc_syntax = { version = "=0.138.0", optional = true }
rayon = "1"
regex = "1.13.1"
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-async-rw"] }
rmp-serde = "1"
rmux-client = { version = "0.10", default-features = false, optional = true }
rmux-sdk = { version = "0.10", default-features = false, optional = true }
rmux-server = { version = "0.10", default-features = false, optional = true }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_toon_format = { version = "0.1", optional = true }
stack-graphs = { package = "basemind-stack-graphs", version = "0.14.1", path = "crates/stack-graphs", optional = true }
streaming-iterator = "0.1"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "io-util",
  "io-std",
  "time",
  "net",
  "fs",
  "process",
] }
tokio-util = { version = "0.7", features = ["codec"], optional = true }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-graph = { package = "basemind-tree-sitter-graph", version = "0.12.0", path = "crates/tree-sitter-graph", optional = true }
tree-sitter-language-pack = "1.15.12"
tree-sitter-stack-graphs = { package = "basemind-tree-sitter-stack-graphs", version = "0.10.0", path = "crates/tree-sitter-stack-graphs", optional = true }
url = { version = "2", features = ["serde"], optional = true }
xberg = { version = "1.1.0", git = "https://github.com/xberg-io/xberg.git", rev = "70f77bfa191be5051abece4690a0b4f3326c7229", default-features = false, features = [
  "tokio-runtime",
  "simd-utf8",
], optional = true }
zstd = "0.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"

[dev-dependencies]
basemind = { path = ".", features = ["test-support"] }
criterion = { version = "0.8", features = ["html_reports"] }
insta = "1"
proptest = "1"
rmcp = { version = "3.1", features = ["client", "transport-async-rw", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1

# ~keep The aarch64-apple-darwin release link sits on a hard cliff. The `full` binary's `__text`
# ~keep reached ~161MB; `xet-runtime` (xberg -> hf-hub -> hf-xet) registers a static constructor,
# ~keep which LLVM emits into `__text_startup`, and ld64 places that section AFTER `__text`. An
# ~keep arm64 B/BL reaches +/-128MB and no branch island can be inserted past the end of the
# ~keep section, so the link failed outright: "ld: B/BL out of range -135343732". The branch has to
# ~keep span from the end of `__text` back to a callee ~26MB in, so the gap shrinks with total size
# ~keep and clearing it needs better than a 5% cut -- a token trim would not hold.
# ~keep The two obvious levers are both unavailable. `lto = "fat"` exhausted the 16GB on
# ~keep ubuntu-latest and the runner was killed mid-link (exit 143). `panic = "abort"` would cut
# ~keep more still, but `scanner_lanes` uses `catch_unwind` to contain a panicking parse to one file
# ~keep rather than lose the whole scan.
# ~keep So dependencies build for size. The scan hot path is exempted below and keeps opt-level 3.
[profile.release.package."*"]
opt-level = "s"

# ~keep Measured hot path (see the scan flamegraph): tree-sitter parsing, the fjall/lsm-tree commit
# ~keep path, and the hashing and scatter-gather around them. These stay at full speed.
[profile.release.package.tree-sitter]
opt-level = 3

[profile.release.package.tree-sitter-language-pack]
opt-level = 3

[profile.release.package.fjall]
opt-level = 3

[profile.release.package.lsm-tree]
opt-level = 3

[profile.release.package.blake3]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.regex]
opt-level = 3

[profile.release.package.rayon]
opt-level = 3

# ~keep Not perf tuning -- correctness. cmake-rs derives CMAKE_BUILD_TYPE from opt-level, so "s"
# ~keep silently builds these as MinSizeRel. xberg-tesseract then installs leptonica under that
# ~keep config while tesseract still configures -DCMAKE_BUILD_TYPE=Release, its exported target
# ~keep stops resolving, and the build script dies in check_leptonica_tiff_support with
# ~keep "IMPORTED_LOCATION not set for imported target leptonica". Only the `full` Windows build
# ~keep compiles tesseract, so CI's `comms shells` leg cannot catch this -- publish is where it lands.
[profile.release.package.xberg-tesseract]
opt-level = 3

[profile.release.package.aws-lc-sys]
opt-level = 3

# ~keep Also not perf tuning. xberg's own workspace pins these two because the archive crates
# ~keep miscompile into a SIGBUS on macOS ARM64 at higher optimization -- sevenz-rust2 needs
# ~keep opt-level 1 specifically (2 still faulted), zip needs at most 2. Cargo profiles only apply
# ~keep from the workspace ROOT, so building xberg as a dependency here silently drops those pins;
# ~keep the `package."*"` size override above would otherwise compile both well past the safe level.
[profile.release.package.sevenz-rust2]
opt-level = 1

[profile.release.package.zip]
opt-level = 2

[[bench]]
name = "extract"
harness = false

[[bench]]
name = "hashing"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "git_history"
harness = false
