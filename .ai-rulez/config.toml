version = "5.0"
name = "basemind"
description = "Code-map MCP server + scanner — pure-Rust, content-addressed, Fjall-backed inverted index."
gitignore = true
gitignore_exclude = ["opencode.json"]

default_layers = ["plugins"]
presets = ["claude", "cursor", "codex", "gemini", "kimi", "opencode", "factory", "hermes", "pi", "copilot"]

builtins = ["rust", "cicd", "documentation", "observability", "default-commands"]

[[mcp_servers]]
name = "ai-rulez"
description = "Manage AI governance config via MCP."
command = "ai-rulez"
args = ["mcp"]

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[codex]
project_doc_max_bytes = 65536

[lint.load_budgets]
"codex-agents-chain" = 65536

[lock]
include_outputs = false
