version = "5.0"
name = "basemind"
description = "Code-map MCP server + scanner — pure-Rust, content-addressed, Fjall-backed inverted index."
gitignore = true

presets = ["claude", "codex", "opencode", "pi"]

builtins = ["rust", "cicd", "documentation", "observability", "default-commands"]

[plugin]
name = "basemind"
version = "0.29.2"
display_name = "basemind"
description = "Full AI context layer over MCP — tree-sitter code-map, document RAG (PDF/Office/HTML/email + OCR + reranker), shared agent memory, on-demand web crawl, git history + blame + per-symbol diff. 300+ languages, 10+ coding-agent harnesses, content-addressed Fjall + LanceDB."
homepage = "https://github.com/Goldziher/basemind"
repository = "https://github.com/Goldziher/basemind"
license = "MIT"
category = "developer-tools"
keywords = ["mcp", "agent-context", "rag", "code-map", "tree-sitter"]
tags = ["mcp", "code-intelligence", "rag", "tree-sitter", "git", "embeddings"]
runtimes = ["hermes", "agent-plugins"]
spec = "1.0.0"
content_root = "."

[plugin.author]
name = "Na'aman Hirschfeld"
email = "nhirschfeld@gmail.com"
url = "https://github.com/Goldziher"

[[plugin.mcp]]
name = "basemind"
command = "basemind"
args = ["serve"]

[plugin.hermes]
source = "pip-package-hermes/basemind_hermes_plugin/hermes.py"
requires_python = ">=3.9"


[[mcp_servers]]
name = "ai-rulez"
description = "Manage AI governance config via MCP."
command = "pnpm"
args = ["dlx", "ai-rulez@5.0.1", "mcp"]

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
text = """AI-RULEZ :: GENERATED FILE — DO NOT EDIT
Source: .ai-rulez/config.toml
Edit .ai-rulez/ content and regenerate with pnpm dlx ai-rulez@5.0.1 generate.
Use MCP server: pnpm dlx ai-rulez@5.0.1 mcp"""
hashes = "full"

[mcp]
self_server_command = ["pnpm", "dlx", "ai-rulez@5.0.1", "mcp"]
